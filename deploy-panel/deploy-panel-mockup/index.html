<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deploy Panel - 轻量级前端部署面板</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<!-- 导航栏 -->
<nav class="navbar">
  <div class="nav-left">
    <div class="logo">🚀 <span>Deploy Panel</span></div>
  </div>
  <div class="nav-center">
    <button class="nav-tab active" data-tab="dashboard">Dashboard</button>
    <button class="nav-tab" data-tab="servers">服务器管理</button>
    <button class="nav-tab" data-tab="history">部署历史</button>
  </div>
  <div class="nav-right">
    <div class="status-dot"></div>
    <span class="status-text">服务运行中</span>
  </div>
</nav>

<!-- Dashboard 页面 -->
<main class="page active" id="page-dashboard">
  <div class="page-header">
    <h1>项目总览</h1>
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="搜索项目..." id="searchInput">
    </div>
  </div>
  <div class="filter-chips">
    <button class="chip active">全部</button>
    <button class="chip">多模块</button>
    <button class="chip">单体项目</button>
    <button class="chip">已配置</button>
    <button class="chip">未配置</button>
  </div>
  <div class="project-grid" id="projectGrid"></div>
</main>

<!-- 服务器管理页面 -->
<main class="page" id="page-servers">
  <div class="page-header">
    <h1>服务器管理</h1>
    <button class="btn-primary" onclick="showAddServer()">+ 添加服务器</button>
  </div>
  <div class="server-list" id="serverList"></div>
</main>

<!-- 部署历史页面 -->
<main class="page" id="page-history">
  <div class="page-header"><h1>部署历史</h1></div>
  <div class="history-table" id="historyTable"></div>
</main>

<!-- 模块选择弹窗 -->
<div class="modal-overlay" id="deployModal">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">选择要部署的模块</h2>
        <p class="modal-subtitle" id="modalSubtitle"></p>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <!-- 单体项目视图 -->
      <div id="singleView" style="display:none">
        <div class="single-info">
          <div class="info-icon">📄</div>
          <p>该项目为单体项目，将整体构建并发布</p>
        </div>
      </div>
      <!-- 多模块项目视图 -->
      <div id="multiView">
        <div class="module-toolbar">
          <div class="module-search">
            <input type="text" placeholder="搜索模块..." id="moduleSearch" oninput="filterModules()">
          </div>
          <div class="module-actions">
            <button class="btn-text" onclick="toggleAll(true)">全选</button>
            <button class="btn-text" onclick="toggleAll(false)">全不选</button>
            <span class="selected-count" id="selectedCount">已选 0 个</span>
          </div>
        </div>
        <div class="module-grid" id="moduleGrid"></div>
      </div>
      <!-- 服务器选择 -->
      <div class="deploy-config">
        <div class="config-row">
          <label>目标服务器</label>
          <select id="targetServer">
            <option>生产-茅台物流 (172.29.121.47)</option>
            <option>生产-师帅 (223.76.236.149)</option>
            <option>测试服务器 (223.76.236.139)</option>
          </select>
        </div>
        <div class="config-row">
          <label>远程路径</label>
          <input type="text" id="remotePath" value="/var/www/kangzhan-cloud/">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="startBuildOnly()">🔨 仅构建</button>
      <button class="btn-primary btn-deploy" onclick="startDeploy()">🚀 构建并部署</button>
    </div>
  </div>
</div>

<!-- 部署日志弹窗 -->
<div class="modal-overlay" id="logModal">
  <div class="modal modal-log">
    <div class="modal-header">
      <div>
        <h2>部署进度</h2>
        <p class="modal-subtitle" id="logSubtitle">kangzhan-cloud → 生产-茅台物流</p>
      </div>
      <button class="modal-close" onclick="closeLogModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="deploy-progress">
        <div class="progress-steps" id="progressSteps"></div>
        <div class="progress-bar-container">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="progress-text" id="progressText">0%</span>
      </div>
      <div class="log-terminal" id="logTerminal"></div>
    </div>
    <div class="modal-footer">
      <div class="deploy-result" id="deployResult" style="display:none">
        <span class="result-icon">✅</span>
        <span>部署完成！耗时 <strong id="deployTime">2m 34s</strong></span>
      </div>
      <button class="btn-secondary" onclick="closeLogModal()">关闭</button>
    </div>
  </div>
</div>

<!-- 添加服务器弹窗 -->
<div class="modal-overlay" id="addServerModal">
  <div class="modal modal-sm">
    <div class="modal-header">
      <h2>添加服务器</h2>
      <button class="modal-close" onclick="document.getElementById('addServerModal').classList.remove('active')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group"><label>服务器名称</label><input type="text" placeholder="如：生产-茅台物流"></div>
      <div class="form-group"><label>Host</label><input type="text" placeholder="192.168.1.100"></div>
      <div class="form-row">
        <div class="form-group"><label>端口</label><input type="text" value="22"></div>
        <div class="form-group"><label>用户名</label><input type="text" value="root"></div>
      </div>
      <div class="form-group"><label>认证方式</label>
        <select><option>密码</option><option>SSH 密钥</option></select>
      </div>
      <div class="form-group"><label>密码</label><input type="password" placeholder="••••••••"></div>
      <div class="form-group"><label>默认部署路径</label><input type="text" placeholder="/var/www/"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="document.getElementById('addServerModal').classList.remove('active')">取消</button>
      <button class="btn-primary">保存</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
