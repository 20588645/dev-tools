<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTools · 待办事项 L2 原型</title>
  <link rel="stylesheet" href="./home-reimagine-common.css">
  <script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
  <style>
    :root {
      --todo-accent: #818cf8;
      --todo-accent-soft: color-mix(in srgb, var(--todo-accent) 11%, transparent);
      --todo-danger: #fb7185;
      --todo-danger-soft: color-mix(in srgb, var(--todo-danger) 10%, transparent);
      --todo-success: #4ade80;
      --todo-warning: #fbbf24;
      --todo-panel: color-mix(in srgb, var(--surface) 94%, transparent);
      --todo-gutter: clamp(12px, 1.45vw, 22px);
    }

    body[data-theme="light"] {
      --todo-accent: #376de5;
      --todo-danger: #dc2626;
      --todo-success: #16a34a;
      --todo-warning: #d97706;
      --todo-panel: color-mix(in srgb, var(--surface) 97%, transparent);
    }

    * {
      scrollbar-color: color-mix(in srgb, var(--text-subtle) 44%, transparent) transparent;
      scrollbar-width: thin;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .48;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .prototype-sidebar {
      padding-top: 18px;
    }

    .prototype-sidebar .app-brand {
      padding-bottom: 14px;
    }

    .prototype-sidebar .app-nav {
      gap: 2px;
    }

    .prototype-sidebar .app-nav-item {
      min-height: 34px;
      font-size: 12px;
    }

    .prototype-sidebar .app-brand-mark {
      border: 0;
      font-family: inherit;
    }

    .prototype-sidebar iconify-icon {
      font-size: 17px;
    }

    .todo-main {
      background: var(--page);
    }

    .todo-page {
      display: grid;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .todo-header {
      display: grid;
      min-height: 84px;
      grid-template-columns: minmax(230px, auto) minmax(270px, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 12px var(--todo-gutter);
      background: color-mix(in srgb, var(--surface) 91%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
    }

    .todo-heading {
      min-width: 0;
    }

    .todo-heading-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .todo-heading-mark {
      display: grid;
      width: 30px;
      height: 30px;
      flex: none;
      place-items: center;
      color: var(--todo-accent);
      background: var(--todo-accent-soft);
      border: 1px solid color-mix(in srgb, var(--todo-accent) 26%, var(--border));
      border-radius: 9px;
    }

    .todo-heading-mark iconify-icon {
      font-size: 17px;
    }

    .todo-heading h1 {
      color: var(--text);
      font-size: 21px;
      font-weight: 720;
      letter-spacing: -.025em;
    }

    .todo-heading p {
      margin: 4px 0 0 40px;
      color: var(--text-subtle);
      font-size: 11px;
    }

    .todo-query {
      display: grid;
      min-width: 0;
      grid-template-columns: minmax(170px, 1fr) auto;
      align-items: center;
      gap: 9px;
    }

    .search-field {
      position: relative;
      min-width: 0;
    }

    .search-field iconify-icon {
      position: absolute;
      top: 50%;
      left: 12px;
      color: var(--text-subtle);
      font-size: 16px;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .search-field input {
      width: 100%;
      height: 38px;
      padding: 0 12px 0 37px;
      color: var(--text);
      background: color-mix(in srgb, var(--surface-raised) 38%, transparent);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: 0;
      transition:
        background-color .16s ease,
        border-color .16s ease,
        box-shadow .16s ease;
    }

    .search-field input::placeholder {
      color: var(--text-subtle);
    }

    .search-field input:focus {
      background: var(--surface);
      border-color: color-mix(in srgb, var(--todo-accent) 60%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--todo-accent) 11%, transparent);
    }

    .filter-tabs {
      display: flex;
      gap: 5px;
      padding: 3px;
      background: color-mix(in srgb, var(--surface-raised) 38%, transparent);
      border: 1px solid var(--border);
      border-radius: 11px;
    }

    .filter-tab {
      min-height: 30px;
      padding: 0 12px;
      color: var(--text-muted);
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 620;
      transition:
        color .16s ease,
        background-color .16s ease,
        box-shadow .16s ease;
    }

    .filter-tab:hover {
      color: var(--text);
    }

    .filter-tab.is-active {
      color: var(--todo-accent);
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      box-shadow: 0 1px 4px color-mix(in srgb, var(--text) 10%, transparent);
    }

    .header-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .theme-segmented {
      display: flex;
      gap: 2px;
      padding: 3px;
      background: color-mix(in srgb, var(--surface-raised) 35%, transparent);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .theme-option {
      min-width: 34px;
      min-height: 30px;
      padding: 0 8px;
      color: var(--text-subtle);
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 10px;
    }

    .theme-option.is-active {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 4px color-mix(in srgb, var(--text) 10%, transparent);
    }

    .primary-button,
    .secondary-button,
    .danger-button,
    .icon-button {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      transition:
        color .16s ease,
        background-color .16s ease,
        border-color .16s ease,
        transform .16s ease;
    }

    .primary-button {
      color: #fff;
      background: var(--todo-accent);
      border: 1px solid var(--todo-accent);
      box-shadow: 0 7px 18px color-mix(in srgb, var(--todo-accent) 20%, transparent);
    }

    .primary-button:hover {
      background: color-mix(in srgb, var(--todo-accent) 88%, white);
      transform: translateY(-1px);
    }

    .secondary-button {
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
    }

    .secondary-button:hover {
      color: var(--text);
      background: var(--surface-soft);
      border-color: var(--border-strong);
    }

    .danger-button {
      color: var(--todo-danger);
      background: var(--todo-danger-soft);
      border: 1px solid color-mix(in srgb, var(--todo-danger) 24%, var(--border));
    }

    .danger-button:hover {
      background: color-mix(in srgb, var(--todo-danger) 15%, transparent);
    }

    .icon-button {
      width: 36px;
      padding: 0;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
    }

    .todo-stage {
      min-width: 0;
      min-height: 0;
      padding: var(--todo-gutter);
      overflow: auto;
    }

    .todo-workspace {
      display: grid;
      width: 100%;
      min-width: 0;
      grid-template-columns: minmax(360px, .88fr) minmax(440px, 1.12fr);
      align-items: start;
      gap: 14px;
    }

    .todo-panel {
      min-width: 0;
      overflow: hidden;
      background: var(--todo-panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 10px 30px color-mix(in srgb, #000 6%, transparent);
    }

    body[data-theme="light"] .todo-panel {
      box-shadow: 0 9px 24px rgba(15, 23, 42, .045);
    }

    .list-panel {
      display: grid;
      min-height: 0;
      grid-template-rows: auto auto;
    }

    .panel-summary {
      display: flex;
      min-height: 44px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 14px;
      color: var(--text-subtle);
      background: color-mix(in srgb, var(--surface-raised) 20%, transparent);
      border-bottom: 1px solid var(--border);
      font-size: 10px;
    }

    .panel-summary strong {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 650;
    }

    .summary-count {
      color: var(--todo-accent);
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }

    .task-groups {
      display: grid;
      align-content: start;
      gap: 2px;
      padding: 8px;
    }

    .task-group {
      min-width: 0;
    }

    .group-heading {
      display: grid;
      width: 100%;
      min-height: 42px;
      grid-template-columns: auto auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      color: var(--text-muted);
      background: transparent;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }

    .group-heading:hover {
      color: var(--text);
      background: var(--surface-soft);
    }

    .group-heading .chevron {
      color: var(--text-subtle);
      font-size: 15px;
      transition: transform .16s ease;
    }

    .task-group.is-collapsed .group-heading .chevron {
      transform: rotate(-90deg);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--todo-warning);
      box-shadow: 0 0 9px color-mix(in srgb, var(--todo-warning) 42%, transparent);
    }

    .status-dot.doing {
      background: var(--todo-accent);
      box-shadow: 0 0 9px color-mix(in srgb, var(--todo-accent) 42%, transparent);
    }

    .status-dot.done {
      background: var(--todo-success);
      box-shadow: 0 0 9px color-mix(in srgb, var(--todo-success) 42%, transparent);
    }

    .group-heading strong {
      color: inherit;
      font-size: 12px;
      font-weight: 680;
    }

    .group-count {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      color: var(--text-subtle);
      background: color-mix(in srgb, var(--surface-raised) 46%, transparent);
      border-radius: 50%;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 9px;
    }

    .group-list {
      display: grid;
      padding: 0 4px 8px;
    }

    .task-group.is-collapsed .group-list {
      display: none;
    }

    .task-row {
      position: relative;
      display: grid;
      width: 100%;
      min-width: 0;
      min-height: 62px;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 11px;
      padding: 9px 11px;
      color: var(--text-muted);
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-bottom-color: var(--border);
      cursor: pointer;
      transition:
        color .16s ease,
        background-color .16s ease,
        border-color .16s ease;
    }

    .task-row:first-child {
      border-radius: 10px 10px 0 0;
    }

    .task-row:last-child {
      border-bottom-color: transparent;
      border-radius: 0 0 10px 10px;
    }

    .task-row:only-child {
      border-radius: 10px;
    }

    .task-row:hover {
      color: var(--text);
      background: var(--surface-soft);
    }

    .task-row.is-selected {
      z-index: 1;
      color: var(--text);
      background: var(--todo-accent-soft);
      border-color: color-mix(in srgb, var(--todo-accent) 50%, var(--border));
      border-radius: 10px;
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--todo-accent) 12%, transparent);
    }

    .task-state {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      color: var(--text-subtle);
      background: transparent;
      border: 1px solid var(--border-strong);
      border-radius: 50%;
    }

    .task-row[data-status="doing"] .task-state {
      color: var(--todo-accent);
      border-color: color-mix(in srgb, var(--todo-accent) 58%, var(--border));
    }

    .task-row[data-status="done"] .task-state {
      color: white;
      background: var(--todo-success);
      border-color: var(--todo-success);
    }

    .task-main {
      display: grid;
      min-width: 0;
      gap: 4px;
    }

    .task-title {
      overflow: hidden;
      color: var(--text);
      font-size: 12px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-row[data-status="done"] .task-title {
      color: var(--text-muted);
      text-decoration: line-through;
      text-decoration-color: color-mix(in srgb, var(--text-subtle) 56%, transparent);
    }

    .task-preview {
      overflow: hidden;
      color: var(--text-subtle);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-meta {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      color: var(--text-subtle);
      font-size: 9px;
      white-space: nowrap;
    }

    .meta-chip,
    .detail-chip {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      color: var(--text-muted);
      background: color-mix(in srgb, var(--surface-raised) 38%, transparent);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 9px;
    }

    .meta-chip.today {
      color: var(--todo-accent);
      background: var(--todo-accent-soft);
      border-color: color-mix(in srgb, var(--todo-accent) 24%, var(--border));
    }

    .meta-chip.overdue {
      color: var(--todo-danger);
      background: var(--todo-danger-soft);
      border-color: color-mix(in srgb, var(--todo-danger) 22%, var(--border));
    }

    .meta-chip iconify-icon,
    .detail-chip iconify-icon {
      font-size: 13px;
    }

    .empty-state {
      display: none;
      min-height: 260px;
      place-items: center;
      padding: 34px;
      color: var(--text-subtle);
      text-align: center;
    }

    .empty-state.is-visible {
      display: grid;
    }

    .empty-state iconify-icon {
      margin-bottom: 10px;
      font-size: 28px;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 5px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .empty-state span {
      font-size: 10px;
    }

    .detail-panel {
      display: grid;
      min-height: 0;
      grid-template-rows: auto auto;
    }

    .detail-topbar {
      display: none;
      min-height: 44px;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: color-mix(in srgb, var(--surface-raised) 24%, transparent);
      border-bottom: 1px solid var(--border);
    }

    .detail-content {
      display: grid;
      align-content: start;
      gap: 18px;
      padding: 18px;
    }

    .detail-title-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }

    .detail-title-input {
      width: 100%;
      min-width: 0;
      height: 40px;
      padding: 0 12px;
      color: var(--text);
      background: color-mix(in srgb, var(--surface-raised) 30%, transparent);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: 0;
      font-size: 14px;
      font-weight: 700;
    }

    .detail-title-input:focus {
      background: var(--surface);
      border-color: color-mix(in srgb, var(--todo-accent) 58%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--todo-accent) 10%, transparent);
    }

    .status-select {
      min-width: 102px;
      height: 40px;
      padding: 0 31px 0 12px;
      color: var(--todo-warning);
      background: color-mix(in srgb, var(--todo-warning) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--todo-warning) 25%, var(--border));
      border-radius: 9px;
      outline: 0;
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
    }

    .detail-meta {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .detail-meta .saved-state {
      margin-left: auto;
      color: var(--text-subtle);
      font-size: 9px;
    }

    .detail-section {
      display: grid;
      gap: 9px;
    }

    .section-heading {
      display: flex;
      min-height: 26px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .section-heading h2 {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 690;
    }

    .text-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 0;
      color: var(--todo-accent);
      background: transparent;
      border: 0;
      cursor: pointer;
      font-size: 10px;
      font-weight: 620;
    }

    .detail-description {
      width: 100%;
      min-height: 116px;
      resize: vertical;
      padding: 12px;
      color: var(--text);
      background: color-mix(in srgb, var(--surface-raised) 24%, transparent);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: 0;
      font-size: 12px;
      line-height: 1.72;
    }

    .detail-description:focus {
      background: var(--surface);
      border-color: color-mix(in srgb, var(--todo-accent) 58%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--todo-accent) 9%, transparent);
    }

    .checklist {
      display: grid;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .checklist-item {
      display: grid;
      min-height: 45px;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 0 12px;
      color: var(--text-muted);
      background: color-mix(in srgb, var(--surface-raised) 18%, transparent);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .checklist-item:last-child {
      border-bottom: 0;
    }

    .checklist-item input {
      width: 16px;
      height: 16px;
      accent-color: var(--todo-accent);
    }

    .checklist-item.is-done span {
      color: var(--text-subtle);
      text-decoration: line-through;
    }

    .checklist-item .remove-check {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      color: var(--text-subtle);
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      opacity: 0;
    }

    .checklist-item:hover .remove-check,
    .checklist-item:focus-within .remove-check {
      opacity: 1;
    }

    .checklist-item .remove-check:hover {
      color: var(--todo-danger);
      background: var(--todo-danger-soft);
    }

    .detail-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    .detail-actions-main {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .prototype-dialog {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(2, 6, 23, .48);
      backdrop-filter: blur(5px);
    }

    .prototype-dialog.is-open {
      display: grid;
    }

    .dialog-card {
      width: min(600px, calc(100vw - 40px));
      max-height: min(720px, calc(100dvh - 40px));
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .3);
    }

    .dialog-header,
    .dialog-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
    }

    .dialog-header {
      border-bottom: 1px solid var(--border);
    }

    .dialog-header h2 {
      color: var(--text);
      font-size: 15px;
    }

    .dialog-header p {
      margin-top: 3px;
      color: var(--text-subtle);
      font-size: 9px;
    }

    .dialog-body {
      display: grid;
      gap: 14px;
      padding: 16px;
    }

    .dialog-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-group {
      display: grid;
      gap: 6px;
    }

    .field-group.full {
      grid-column: 1 / -1;
    }

    .field-group label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 650;
    }

    .field-group input,
    .field-group textarea,
    .field-group select {
      width: 100%;
      color: var(--text);
      background: color-mix(in srgb, var(--surface-raised) 38%, transparent);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: 0;
    }

    .field-group input,
    .field-group select {
      height: 38px;
      padding: 0 11px;
    }

    .field-group textarea {
      min-height: 92px;
      resize: vertical;
      padding: 10px 11px;
      line-height: 1.6;
    }

    .field-group input:focus,
    .field-group textarea:focus,
    .field-group select:focus {
      background: var(--surface);
      border-color: color-mix(in srgb, var(--todo-accent) 58%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--todo-accent) 9%, transparent);
    }

    .dialog-footer {
      border-top: 1px solid var(--border);
    }

    .prototype-toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 100;
      max-width: 320px;
      padding: 10px 13px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, .22);
      font-size: 10px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .16s ease, transform .16s ease;
    }

    .prototype-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1180px) {
      .todo-header {
        grid-template-columns: minmax(180px, auto) minmax(250px, 1fr) auto;
        gap: 10px;
      }

      .todo-heading p {
        display: none;
      }

      .theme-segmented {
        display: none;
      }

      .todo-workspace {
        grid-template-columns: minmax(320px, .9fr) minmax(390px, 1.1fr);
      }

      .task-preview {
        display: none;
      }
    }

    @media (max-width: 1040px) {
      .todo-header {
        min-height: 92px;
        grid-template-columns: minmax(170px, auto) minmax(0, 1fr) auto;
      }

      .todo-query {
        grid-template-columns: minmax(170px, 1fr);
        gap: 5px;
      }

      .filter-tabs {
        width: max-content;
        background: transparent;
        border: 0;
        padding: 0;
      }

      .filter-tab {
        min-height: 26px;
        padding-inline: 9px;
      }

      .todo-workspace {
        display: block;
      }

      .detail-panel {
        display: none;
      }

      .todo-page.is-detail-open .list-panel {
        display: none;
      }

      .todo-page.is-detail-open .detail-panel {
        display: grid;
      }

      .todo-page.is-detail-open .detail-topbar {
        display: flex;
      }

      .task-preview {
        display: block;
      }
    }

    @media (max-width: 920px) {
      .todo-header {
        grid-template-columns: minmax(132px, auto) minmax(180px, 1fr) auto;
        padding-inline: 10px;
      }

      .todo-heading-mark {
        width: 26px;
        height: 26px;
      }

      .todo-heading h1 {
        font-size: 17px;
      }

      .todo-heading p {
        display: none;
      }

      .todo-header .primary-button span {
        display: none;
      }

      .todo-header .primary-button {
        width: 36px;
        padding: 0;
      }

      .todo-stage {
        padding: 10px;
      }

      .todo-panel {
        border-radius: 12px;
      }

      .detail-content {
        gap: 14px;
        padding: 14px;
      }

      .detail-description {
        min-height: 92px;
      }
    }

    @media (max-height: 680px) {
      .todo-header {
        min-height: 72px;
        padding-block: 8px;
      }

      .todo-heading p {
        display: none;
      }

      .todo-stage {
        padding-block: 9px;
      }

      .task-row {
        min-height: 54px;
      }

      .detail-content {
        gap: 12px;
      }

      .detail-description {
        min-height: 78px;
      }

      .checklist-item {
        min-height: 39px;
      }
    }

    @media (max-width: 1040px) and (max-height: 680px) {
      .todo-header {
        min-height: 64px;
        grid-template-columns: minmax(130px, auto) minmax(0, 1fr) auto;
      }

      .todo-query {
        grid-template-columns: minmax(170px, 1fr) auto;
        gap: 7px;
      }

      .filter-tab {
        min-height: 30px;
      }

      .detail-topbar {
        min-height: 38px;
      }

      .detail-content {
        gap: 10px;
        padding-block: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

    <main class="app-main todo-main">
      <section class="todo-page" id="todoPage">
        <header class="todo-header">
          <div class="todo-heading">

          <div class="header-actions">

        <div class="todo-stage">
          <div class="todo-workspace">

                  <iconify-icon icon="tabler:list-search"></iconify-icon>

                <div class="detail-meta">
                  <span class="detail-chip" id="detailDate"><iconify-icon icon="tabler:calendar"></iconify-icon>7月29日</span>
                  <span class="detail-chip" id="detailProgress"><iconify-icon icon="tabler:list-check"></iconify-icon>0/4</span>

  <div class="prototype-dialog" id="createDialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">

  <div class="prototype-toast" id="prototypeToast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const body = document.body;
      const todoPage = $('todoPage');
      const taskGroups = $('taskGroups');
      const emptyState = $('emptyState');
      const taskSearch = $('taskSearch');
      const detailTitle = $('detailTitle');
      const detailStatus = $('detailStatus');
      const detailDescription = $('detailDescription');
      const detailDate = $('detailDate');
      const detailProgress = $('detailProgress');
      const checklist = $('checklist');
      const advanceTaskButton = $('advanceTaskButton');
      const savedState = $('savedState');
      const toast = $('prototypeToast');

      const statusMeta = {
        todo: { label: '待办', className: '', icon: 'tabler:circle' },
        doing: { label: '进行中', className: 'doing', icon: 'tabler:player-play' },
        done: { label: '已完成', className: 'done', icon: 'tabler:check' }
      };

      let tasks = [
        {
          id: 'todo-1',
          title: '整理 Vue 迁移清单',
          description: '梳理当前项目中的 Vue 2 相关代码与依赖，输出迁移任务清单，标注风险点与预计工时。',
          status: 'todo',
          date: '2026-07-29',
          timing: 'today',
          checklist: [
            { text: '扫描项目中 Vue 2 相关依赖与用法', done: false },
            { text: '整理迁移影响范围与风险点', done: false },
            { text: '拆解迁移任务并估算工时', done: false },
            { text: '输出迁移清单文档', done: false }
          ]
        },
        {
          id: 'todo-2',
          title: '修复待办提醒去重',
          description: '解决重新安排提醒后同一任务无法再次提醒的问题。',
          status: 'todo',
          date: '2026-07-28',
          timing: 'overdue',
          checklist: [
            { text: '确认当前提醒去重键', done: false },
            { text: '整理后续独立专项范围', done: false }
          ]
        },
        {
          id: 'doing-1',
          title: '检查发布脚本',
          description: '验证版本号同步、构建产物和更新清单是否一致。',
          status: 'doing',
          date: '2026-07-29',
          timing: 'today',
          checklist: [
            { text: '检查版本号同步', done: true },
            { text: '验证构建产物', done: false },
            { text: '核对更新清单', done: false }
          ]
        },
        {
          id: 'done-1',
          title: '升级依赖包',
          description: '升级本轮迁移需要的前端依赖。',
          status: 'done',
          date: '2026-07-27',
          timing: 'past',
          checklist: [
            { text: '检查依赖兼容性', done: true },
            { text: '完成依赖升级', done: true }
          ]
        },
        {
          id: 'done-2',
          title: '优化登录性能',
          description: '减少启动阶段不必要的请求。',
          status: 'done',
          date: '2026-07-26',
          timing: 'past',
          checklist: [
            { text: '记录性能基线', done: true },
            { text: '移除重复请求', done: true }
          ]
        },
        {
          id: 'done-3',
          title: '撰写接口文档',
          description: '补充内部 API 的调用示例。',
          status: 'done',
          date: '2026-07-25',
          timing: 'past',
          checklist: [
            { text: '整理接口目录', done: true },
            { text: '补充请求示例', done: true }
          ]
        }
      ];

      let selectedTaskId = tasks[0].id;
      let activeFilter = 'all';
      let toastTimer = null;
      const collapsedGroups = new Set();
      let detailSnapshot = null;

      const escapeHtml = (value) => String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

      const icon = (name) => `<iconify-icon icon="${name}"></iconify-icon>`;
      const currentTask = () => tasks.find((task) => task.id === selectedTaskId) || tasks[0];
      const progressFor = (task) => `${task.checklist.filter((item) => item.done).length}/${task.checklist.length}`;
      const formatDate = (date) => {
        const [, month, day] = date.split('-');
        return `${Number(month)}月${Number(day)}日`;
      };

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('is-visible');
        toastTimer = window.setTimeout(() => toast.classList.remove('is-visible'), 1800);
      }

      function filteredTasks() {
        const query = taskSearch.value.trim().toLowerCase();
        return tasks.filter((task) => {
          const filterMatch = activeFilter === 'all' || task.timing === activeFilter;
          const haystack = [
            task.title,
            task.description,
            ...task.checklist.map((item) => item.text)
          ].join(' ').toLowerCase();
          return filterMatch && (!query || haystack.includes(query));
        });
      }

      function renderTaskRow(task) {
        const meta = statusMeta[task.status];
        const timingChip = task.status === 'done'
          ? ''
          : task.timing === 'today'
            ? `<span class="meta-chip today">${icon('tabler:calendar')}今天</span>`
            : task.timing === 'overdue'
              ? `<span class="meta-chip overdue">${icon('tabler:alert-circle')}已逾期</span>`
              : '';

        return `
          <button class="task-row${task.id === selectedTaskId ? ' is-selected' : ''}" type="button"
            data-task-id="${task.id}" data-status="${task.status}">
            <span class="task-state">${icon(meta.icon)}</span>
            <span class="task-main">
              <span class="task-title">${escapeHtml(task.title)}</span>
              <span class="task-preview">${escapeHtml(task.description)}</span>
            </span>
            <span class="task-meta">
              <span class="meta-chip">${icon('tabler:list-check')}${progressFor(task)}</span>
              ${timingChip}
              <span>${formatDate(task.date)}</span>
            </span>
          </button>`;
      }

      function renderGroups() {
        const visible = filteredTasks();
        $('visibleTaskCount').textContent = visible.length;
        emptyState.classList.toggle('is-visible', visible.length === 0);
        taskGroups.style.display = visible.length ? 'grid' : 'none';

        taskGroups.innerHTML = ['todo', 'doing', 'done'].map((status) => {
          const items = visible.filter((task) => task.status === status);
          if (!items.length) return '';
          const meta = statusMeta[status];
          const collapsed = collapsedGroups.has(status);
          return `
            <section class="task-group${collapsed ? ' is-collapsed' : ''}" data-group="${status}">
              <button class="group-heading" type="button" data-toggle-group="${status}" aria-expanded="${!collapsed}">
                <iconify-icon class="chevron" icon="tabler:chevron-down"></iconify-icon>
                <span class="status-dot ${meta.className}"></span>
                <strong>${meta.label}</strong>
                <span class="group-count">${items.length}</span>
              </button>
              <div class="group-list">${items.map(renderTaskRow).join('')}</div>
            </section>`;
        }).join('');

        taskGroups.querySelectorAll('[data-task-id]').forEach((row) => {
          row.addEventListener('click', () => {
            selectedTaskId = row.dataset.taskId;
            renderGroups();
            renderDetail();
            if (window.matchMedia('(max-width: 1040px)').matches) {
              todoPage.classList.add('is-detail-open');
            }
          });
        });

        taskGroups.querySelectorAll('[data-toggle-group]').forEach((button) => {
          button.addEventListener('click', () => {
            const status = button.dataset.toggleGroup;
            collapsedGroups.has(status) ? collapsedGroups.delete(status) : collapsedGroups.add(status);
            renderGroups();
          });
        });
      }

      function updateStatusSelectTone(status) {
        const colors = {
          todo: ['var(--todo-warning)', 'color-mix(in srgb, var(--todo-warning) 8%, transparent)', 'color-mix(in srgb, var(--todo-warning) 25%, var(--border))'],
          doing: ['var(--todo-accent)', 'var(--todo-accent-soft)', 'color-mix(in srgb, var(--todo-accent) 28%, var(--border))'],
          done: ['var(--todo-success)', 'color-mix(in srgb, var(--todo-success) 8%, transparent)', 'color-mix(in srgb, var(--todo-success) 25%, var(--border))']
        };
        const [color, background, borderColor] = colors[status];
        detailStatus.style.color = color;
        detailStatus.style.background = background;
        detailStatus.style.borderColor = borderColor;
      }

      function renderDetail() {
        const task = currentTask();
        if (!task) return;
        detailSnapshot = JSON.parse(JSON.stringify(task));
        detailTitle.value = task.title;
        detailStatus.value = task.status;
        detailDescription.value = task.description;
        detailDate.innerHTML = `${icon('tabler:calendar')}${formatDate(task.date)}`;
        detailProgress.innerHTML = `${icon('tabler:list-check')}${progressFor(task)}`;
        savedState.textContent = '已自动保存 · 刚刚';
        updateStatusSelectTone(task.status);

        checklist.innerHTML = task.checklist.map((item, index) => `
          <label class="checklist-item${item.done ? ' is-done' : ''}">
            <input type="checkbox" data-check-index="${index}"${item.done ? ' checked' : ''}>
            <span>${escapeHtml(item.text)}</span>
            <button class="remove-check" type="button" data-remove-check="${index}" aria-label="删除子项">
              ${icon('tabler:x')}
            </button>
          </label>`).join('');

        const action = {
          todo: ['tabler:player-play', '开始执行'],
          doing: ['tabler:check', '标记完成'],
          done: ['tabler:refresh', '重新打开']
        }[task.status];
        advanceTaskButton.innerHTML = `${icon(action[0])}<span>${action[1]}</span>`;

        checklist.querySelectorAll('[data-check-index]').forEach((input) => {
          input.addEventListener('change', () => {
            task.checklist[Number(input.dataset.checkIndex)].done = input.checked;
            savedState.textContent = '正在保存…';
            window.setTimeout(() => {
              savedState.textContent = '已自动保存 · 刚刚';
              renderGroups();
              renderDetail();
            }, 260);
          });
        });

        checklist.querySelectorAll('[data-remove-check]').forEach((button) => {
          button.addEventListener('click', (event) => {
            event.preventDefault();
            task.checklist.splice(Number(button.dataset.removeCheck), 1);
            renderGroups();
            renderDetail();
            showToast('子项已删除');
          });
        });
      }

      function syncEditableField(field, key) {
        const task = currentTask();
        if (!task) return;
        task[key] = field.value.trim() || detailSnapshot[key];
        savedState.textContent = '正在保存…';
        window.setTimeout(() => {
          savedState.textContent = '已自动保存 · 刚刚';
          renderGroups();
        }, 320);
      }

      function setTheme(theme) {
        body.dataset.theme = theme;
        document.querySelectorAll('[data-theme-value]').forEach((button) => {
          button.classList.toggle('is-active', button.dataset.themeValue === theme);
        });
        $('sidebarThemeLabel').textContent = theme === 'dark' ? '切换亮色' : '切换暗色';
        $('sidebarThemeButton').querySelector('iconify-icon').setAttribute('icon', theme === 'dark' ? 'tabler:sun' : 'tabler:moon');
      }

      function openDialog() {
        $('createDialog').classList.add('is-open');
        window.setTimeout(() => $('newTaskTitle').focus(), 30);
      }

      function closeDialog() {
        $('createDialog').classList.remove('is-open');
        $('createForm').reset();
        $('newTaskReminder').value = '2026-07-29T17:00';
      }

      document.querySelectorAll('a[href="#"]').forEach((link) => {
        link.addEventListener('click', (event) => event.preventDefault());
      });

      document.querySelectorAll('[data-theme-value]').forEach((button) => {
        button.addEventListener('click', () => setTheme(button.dataset.themeValue));
      });
      $('sidebarThemeButton').addEventListener('click', () => {
        setTheme(body.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      document.querySelectorAll('[data-filter]').forEach((button) => {
        button.addEventListener('click', () => {
          activeFilter = button.dataset.filter;
          document.querySelectorAll('[data-filter]').forEach((tab) => {
            tab.classList.toggle('is-active', tab === button);
          });
          renderGroups();
        });
      });

      taskSearch.addEventListener('input', renderGroups);
      detailTitle.addEventListener('change', () => syncEditableField(detailTitle, 'title'));
      detailDescription.addEventListener('change', () => syncEditableField(detailDescription, 'description'));
      detailStatus.addEventListener('change', () => {
        const task = currentTask();
        task.status = detailStatus.value;
        if (task.status === 'done') {
          task.checklist.forEach((item) => { item.done = true; });
        }
        renderGroups();
        renderDetail();
        showToast(`任务已切换为${statusMeta[task.status].label}`);
      });

      $('addChecklistButton').addEventListener('click', () => {
        currentTask().checklist.push({ text: '新的子任务', done: false });
        renderGroups();
        renderDetail();
        const items = checklist.querySelectorAll('.checklist-item span');
        items[items.length - 1]?.scrollIntoView({ block: 'nearest' });
        showToast('已添加子项');
      });

      advanceTaskButton.addEventListener('click', () => {
        const task = currentTask();
        if (task.status === 'todo') task.status = 'doing';
        else if (task.status === 'doing') {
          const unfinished = task.checklist.filter((item) => !item.done).length;
          if (unfinished) {
            const completeAll = window.confirm(`还有 ${unfinished} 个未完成子项，是否同时完成全部子项？`);
            if (!completeAll) return;
            task.checklist.forEach((item) => { item.done = true; });
          }
          task.status = 'done';
        } else task.status = 'todo';
        renderGroups();
        renderDetail();
        showToast(`任务已切换为${statusMeta[task.status].label}`);
      });

      $('revertTaskButton').addEventListener('click', () => {
        const index = tasks.findIndex((task) => task.id === selectedTaskId);
        tasks[index] = JSON.parse(JSON.stringify(detailSnapshot));
        renderGroups();
        renderDetail();
        showToast('已撤销本次修改');
      });

      $('deleteTaskButton').addEventListener('click', () => {
        const task = currentTask();
        if (!window.confirm(`确认删除“${task.title}”吗？`)) return;
        tasks = tasks.filter((item) => item.id !== task.id);
        selectedTaskId = tasks[0]?.id || '';
        todoPage.classList.remove('is-detail-open');
        renderGroups();
        renderDetail();
        showToast('任务已删除');
      });

      $('backToListButton').addEventListener('click', () => {
        todoPage.classList.remove('is-detail-open');
      });
      $('createTaskButton').addEventListener('click', openDialog);
      $('closeDialogButton').addEventListener('click', closeDialog);
      $('cancelCreateButton').addEventListener('click', closeDialog);
      $('createDialog').addEventListener('click', (event) => {
        if (event.target === $('createDialog')) closeDialog();
      });

      $('createForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const reminder = String(form.get('reminder') || '');
        const status = String(form.get('status') || 'todo');
        const newTask = {
          id: `todo-${Date.now()}`,
          title: String(form.get('title')).trim(),
          description: String(form.get('description')).trim() || '暂无任务描述',
          status,
          date: reminder ? reminder.slice(0, 10) : '2026-07-29',
          timing: reminder.startsWith('2026-07-29') ? 'today' : 'past',
          checklist: []
        };
        tasks.unshift(newTask);
        selectedTaskId = newTask.id;
        activeFilter = 'all';
        document.querySelectorAll('[data-filter]').forEach((tab) => {
          tab.classList.toggle('is-active', tab.dataset.filter === 'all');
        });
        closeDialog();
        renderGroups();
        renderDetail();
        showToast('任务已创建');
        if (window.matchMedia('(max-width: 1040px)').matches) {
          todoPage.classList.add('is-detail-open');
        }
      });

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && $('createDialog').classList.contains('is-open')) closeDialog();
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          taskSearch.focus();
        }
      });

      setTheme('light');
      renderGroups();
      renderDetail();
    })();
  </script>
</body>
</html>
