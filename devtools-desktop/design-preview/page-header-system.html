<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevTools · 全页面顶部组件预览</title>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    /* Primitive tokens */
    :root {
      color-scheme: light;
      --p-white: #ffffff;
      --p-slate-25: #fbfcfe;
      --p-slate-50: #f7f9fc;
      --p-slate-75: #f2f5fa;
      --p-slate-100: #edf1f7;
      --p-slate-150: #e5eaf2;
      --p-slate-200: #d8e0eb;
      --p-slate-300: #b8c3d1;
      --p-slate-400: #8d9aaa;
      --p-slate-500: #687587;
      --p-slate-600: #4a5667;
      --p-slate-700: #303b4b;
      --p-slate-800: #202a38;
      --p-slate-850: #182230;
      --p-slate-900: #111b29;
      --p-slate-925: #0d1724;
      --p-slate-950: #09131f;
      --p-blue-50: #eef5ff;
      --p-blue-100: #dceaff;
      --p-blue-200: #bdd6ff;
      --p-blue-400: #6098f6;
      --p-blue-500: #437fe6;
      --p-blue-600: #3269cc;
      --p-blue-700: #2855aa;
      --p-green-100: #dff5ea;
      --p-green-400: #4fc08a;
      --p-green-500: #2e9e6e;
      --p-amber-100: #fff0cf;
      --p-amber-500: #c98922;
      --p-red-100: #fee5e6;
      --p-red-500: #d95763;
      --p-transparent: transparent;
      --p-shadow-soft: 0 18px 48px rgba(30, 45, 66, 0.12);
      --p-shadow-menu: 0 14px 34px rgba(20, 34, 53, 0.18);
      --p-shadow-dark: 0 24px 58px rgba(0, 0, 0, 0.34);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-7: 28px;
      --space-8: 32px;
      --space-10: 40px;
      --radius-sm: 6px;
      --radius-md: 9px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --radius-round: 999px;
      --font-xs: 11px;
      --font-sm: 12px;
      --font-md: 13px;
      --font-base: 14px;
      --font-lg: 16px;
      --font-xl: 20px;
      --font-2xl: 24px;
      --weight-regular: 400;
      --weight-medium: 520;
      --weight-semibold: 640;
      --duration-fast: 150ms;
      --duration-normal: 220ms;
    }

    /* Semantic tokens */
    :root {
      --preview-bg: var(--p-slate-100);
      --app-bg: var(--p-slate-50);
      --sidebar-bg: var(--p-slate-25);
      --page-bg: var(--p-slate-50);
      --surface: var(--p-white);
      --surface-subtle: var(--p-slate-75);
      --surface-muted: var(--p-slate-100);
      --surface-hover: var(--p-blue-50);
      --surface-active: var(--p-blue-50);
      --popover-bg: var(--p-white);
      --text-primary: var(--p-slate-900);
      --text-secondary: var(--p-slate-500);
      --text-tertiary: var(--p-slate-500);
      --text-inverse: var(--p-white);
      --border-subtle: var(--p-slate-150);
      --border-default: var(--p-slate-200);
      --border-strong: var(--p-slate-300);
      --accent: var(--p-blue-600);
      --accent-hover: var(--p-blue-700);
      --accent-active: var(--p-blue-700);
      --accent-soft: var(--p-blue-50);
      --accent-border: var(--p-blue-200);
      --primary-action-bg: var(--p-blue-600);
      --primary-action-hover: var(--p-blue-700);
      --primary-action-active: var(--p-blue-700);
      --success: var(--p-green-500);
      --success-soft: var(--p-green-100);
      --warning: var(--p-amber-500);
      --warning-soft: var(--p-amber-100);
      --danger: var(--p-red-500);
      --danger-soft: var(--p-red-100);
      --focus-ring: var(--p-blue-400);
      --window-shadow: var(--p-shadow-soft);
      --menu-shadow: var(--p-shadow-menu);
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --preview-bg: var(--p-slate-950);
      --app-bg: var(--p-slate-925);
      --sidebar-bg: var(--p-slate-950);
      --page-bg: var(--p-slate-925);
      --surface: var(--p-slate-850);
      --surface-subtle: var(--p-slate-900);
      --surface-muted: var(--p-slate-800);
      --surface-hover: var(--p-slate-800);
      --surface-active: var(--p-slate-800);
      --popover-bg: var(--p-slate-800);
      --text-primary: var(--p-slate-50);
      --text-secondary: var(--p-slate-400);
      --text-tertiary: var(--p-slate-400);
      --text-inverse: var(--p-white);
      --border-subtle: var(--p-slate-850);
      --border-default: var(--p-slate-700);
      --border-strong: var(--p-slate-600);
      --accent: var(--p-blue-400);
      --accent-hover: var(--p-blue-500);
      --accent-active: var(--p-blue-600);
      --accent-soft: var(--p-slate-800);
      --accent-border: var(--p-blue-600);
      --primary-action-bg: var(--p-blue-600);
      --primary-action-hover: var(--p-blue-700);
      --primary-action-active: var(--p-blue-700);
      --success: var(--p-green-400);
      --success-soft: var(--p-slate-800);
      --warning: var(--p-amber-500);
      --warning-soft: var(--p-slate-800);
      --danger: var(--p-red-500);
      --danger-soft: var(--p-slate-800);
      --window-shadow: var(--p-shadow-dark);
      --menu-shadow: var(--p-shadow-dark);
    }

    /* Component tokens */
    :root {
      --page-top-bg: var(--page-bg);
      --page-top-border: var(--border-subtle);
      --page-top-padding-x: var(--space-6);
      --page-top-row-gap: var(--space-3);
      --page-header-min-height: 48px;
      --page-header-icon-size: 38px;
      --page-header-title-size: var(--font-xl);
      --page-toolbar-min-height: 50px;
      --page-toolbar-gap: var(--space-2);
      --control-height: 34px;
      --control-radius: var(--radius-md);
      --control-bg: var(--surface);
      --control-border: var(--border-default);
      --control-hover-bg: var(--surface-hover);
      --card-bg: var(--surface);
      --card-border: var(--border-subtle);
      --card-radius: var(--radius-lg);
    }

    * { box-sizing: border-box; }

    html, body { min-width: 320px; min-height: 100%; }

    body {
      margin: 0;
      overflow: auto;
      color: var(--text-primary);
      background: var(--preview-bg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: var(--font-base);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select { font: inherit; }
    button { color: inherit; }
    iconify-icon { display: inline-flex; flex: 0 0 auto; }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .prototype-toolbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      min-height: 74px;
      padding: var(--space-3) var(--space-6);
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      color: var(--text-primary);
      background: var(--surface);
      border-bottom: 1px solid var(--border-subtle);
    }

    .prototype-title { min-width: 0; }
    .prototype-title strong { display: block; font-size: var(--font-lg); font-weight: var(--weight-semibold); letter-spacing: -0.01em; }
    .prototype-title span { display: block; margin-top: 3px; color: var(--text-secondary); font-size: var(--font-sm); }

    .prototype-controls { display: flex; align-items: center; gap: var(--space-2); }
    .control-group {
      display: inline-flex;
      height: 38px;
      padding: 3px;
      align-items: center;
      gap: 2px;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }
    .control-group button,
    .theme-button {
      display: inline-flex;
      height: 30px;
      padding: 0 var(--space-3);
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-secondary);
      background: var(--p-transparent);
      border: 0;
      border-radius: var(--radius-md);
      font-size: var(--font-sm);
      cursor: pointer;
      transition: color var(--duration-fast), background var(--duration-fast), box-shadow var(--duration-fast);
    }
    .control-group button[aria-pressed="true"] {
      color: var(--text-primary);
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(20, 34, 53, 0.08);
    }
    .theme-button {
      height: 38px;
      padding-inline: var(--space-3);
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
    }
    .theme-button:hover, .control-group button:hover { color: var(--text-primary); }

    .preview-stage {
      display: grid;
      min-height: calc(100vh - 74px);
      padding: var(--space-7);
      place-items: center;
    }

    .app-window {
      container: app / inline-size;
      width: min(1420px, 100%);
      height: min(850px, calc(100vh - 130px));
      min-height: 660px;
      overflow: hidden;
      background: var(--app-bg);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-xl);
      box-shadow: var(--window-shadow);
      transition: width var(--duration-normal), height var(--duration-normal), background var(--duration-fast);
    }

    .app-window.is-compact { width: min(900px, 100%); height: 600px; min-height: 600px; }

    .app-layout { display: grid; grid-template-columns: 188px minmax(0, 1fr); height: 100%; }

    .sidebar {
      display: flex;
      min-height: 0;
      padding: var(--space-4) var(--space-3) var(--space-3);
      flex-direction: column;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-subtle);
    }

    .brand {
      display: flex;
      height: 42px;
      padding: 0 var(--space-2);
      align-items: center;
      gap: 9px;
      font-size: var(--font-md);
      font-weight: var(--weight-semibold);
      letter-spacing: -0.01em;
    }
    .brand-mark {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-sm);
    }

    .sidebar-nav {
      display: flex;
      min-height: 0;
      margin-top: var(--space-2);
      padding-right: 2px;
      flex: 1;
      flex-direction: column;
      gap: 2px;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-default) var(--p-transparent);
    }

    .nav-item {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 37px;
      padding: 0 var(--space-3);
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      background: var(--p-transparent);
      border: 1px solid var(--p-transparent);
      border-radius: var(--radius-md);
      font-size: var(--font-md);
      text-align: left;
      cursor: pointer;
      transition: color var(--duration-fast), background var(--duration-fast), border-color var(--duration-fast);
    }
    .nav-item iconify-icon { width: 18px; height: 18px; font-size: 18px; }
    .nav-item span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item:hover { color: var(--text-primary); background: var(--surface-subtle); }
    .nav-item[aria-current="page"] {
      color: var(--accent);
      background: var(--accent-soft);
      border-color: var(--accent-border);
      font-weight: var(--weight-medium);
    }
    .nav-item[aria-current="page"]::before {
      position: absolute;
      top: 9px;
      bottom: 9px;
      left: -7px;
      width: 3px;
      background: var(--accent);
      border-radius: var(--radius-round);
      content: "";
    }

    .sidebar-footer {
      display: flex;
      margin-top: var(--space-2);
      padding: var(--space-2) var(--space-2) 0;
      align-items: center;
      justify-content: space-between;
      color: var(--text-tertiary);
      border-top: 1px solid var(--border-subtle);
      font-size: var(--font-xs);
    }
    .sidebar-footer span { display: inline-flex; align-items: center; gap: 5px; }

    .page-frame {
      container: page / inline-size;
      display: flex;
      min-width: 0;
      min-height: 0;
      flex-direction: column;
      background: var(--page-bg);
    }

    .page-top {
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      padding: var(--space-2) var(--page-top-padding-x) 0;
      background: var(--page-top-bg);
      border-bottom: 1px solid var(--page-top-border);
    }

    .page-header {
      display: grid;
      min-height: var(--page-header-min-height);
      grid-template-columns: var(--page-header-icon-size) minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-3);
    }

    .page-icon {
      display: grid;
      width: var(--page-header-icon-size);
      height: var(--page-header-icon-size);
      place-items: center;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid var(--accent-border);
      border-radius: var(--radius-md);
    }
    .page-icon iconify-icon { font-size: 20px; }

    .page-heading { min-width: 0; }
    .page-heading h1 {
      margin: 0;
      overflow: hidden;
      color: var(--text-primary);
      font-size: var(--page-header-title-size);
      font-weight: var(--weight-semibold);
      line-height: 1.24;
      letter-spacing: -0.018em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .page-heading p {
      margin: 4px 0 0;
      overflow: hidden;
      color: var(--text-secondary);
      font-size: var(--font-sm);
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .page-actions { position: relative; display: flex; align-items: center; gap: var(--space-2); }

    .btn {
      display: inline-flex;
      height: var(--control-height);
      padding: 0 var(--space-3);
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-primary);
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      border-radius: var(--control-radius);
      font-size: var(--font-sm);
      font-weight: var(--weight-medium);
      white-space: nowrap;
      cursor: pointer;
      transition: color var(--duration-fast), background var(--duration-fast), border-color var(--duration-fast), transform var(--duration-fast);
    }
    .btn:hover { background: var(--control-hover-bg); border-color: var(--border-strong); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { color: var(--text-inverse); background: var(--primary-action-bg); border-color: var(--primary-action-bg); }
    .btn.primary:hover { background: var(--primary-action-hover); border-color: var(--primary-action-hover); }
    .btn.primary:active { background: var(--primary-action-active); }
    .btn.ghost { background: var(--p-transparent); border-color: var(--p-transparent); }
    .btn.icon-only { width: var(--control-height); padding: 0; }
    .btn iconify-icon { font-size: 16px; }

    .overflow-menu {
      position: absolute;
      top: calc(100% + 7px);
      right: 0;
      z-index: 30;
      display: none;
      width: 178px;
      padding: 5px;
      background: var(--popover-bg);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--menu-shadow);
    }
    .overflow-menu.is-open { display: block; }
    .overflow-menu button {
      display: flex;
      width: 100%;
      height: 34px;
      padding: 0 9px;
      align-items: center;
      gap: 8px;
      color: var(--text-secondary);
      background: var(--p-transparent);
      border: 0;
      border-radius: var(--radius-sm);
      font-size: var(--font-sm);
      text-align: left;
      cursor: pointer;
    }
    .overflow-menu button:hover { color: var(--text-primary); background: var(--surface-hover); }
    .overflow-menu iconify-icon { font-size: 15px; }

    .page-subnav {
      display: flex;
      min-width: 0;
      margin-top: var(--space-2);
      padding: 3px;
      gap: 2px;
      overflow-x: auto;
      background: var(--surface-muted);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      scrollbar-width: none;
    }
    .page-subnav::-webkit-scrollbar { display: none; }
    .subnav-tab {
      display: inline-flex;
      height: 31px;
      padding: 0 var(--space-3);
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      background: var(--p-transparent);
      border: 0;
      border-radius: var(--radius-sm);
      font-size: var(--font-sm);
      white-space: nowrap;
      cursor: pointer;
    }
    .subnav-tab:hover { color: var(--text-primary); }
    .subnav-tab[aria-selected="true"] { color: var(--text-primary); background: var(--surface); box-shadow: 0 1px 2px rgba(20, 34, 53, 0.08); }

    .page-toolbar {
      display: flex;
      min-height: var(--page-toolbar-min-height);
      padding: 10px 0;
      align-items: center;
      gap: var(--page-toolbar-gap);
    }
    .toolbar-primary { display: flex; min-width: 180px; flex: 1 1 280px; align-items: center; gap: var(--space-2); }
    .toolbar-filters { display: flex; min-width: 0; flex: 0 1 auto; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .toolbar-filters::-webkit-scrollbar { display: none; }
    .toolbar-tail { display: flex; flex: 0 0 auto; align-items: center; gap: var(--space-2); }

    .search-field { position: relative; min-width: 180px; max-width: 420px; flex: 1 1 260px; }
    .search-field iconify-icon {
      position: absolute;
      top: 50%;
      left: 11px;
      z-index: 1;
      color: var(--text-tertiary);
      font-size: 16px;
      transform: translateY(-50%);
      pointer-events: none;
    }
    .search-field input,
    .input-field,
    .select-field {
      width: 100%;
      height: var(--control-height);
      color: var(--text-primary);
      background: var(--control-bg);
      border: 1px solid var(--control-border);
      border-radius: var(--control-radius);
      font-size: var(--font-sm);
      transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
    }
    .search-field input { padding: 0 var(--space-3) 0 34px; }
    .input-field { min-width: 220px; padding: 0 var(--space-3); }
    .select-field { min-width: 184px; padding: 0 32px 0 var(--space-3); }
    .search-field input::placeholder, .input-field::placeholder { color: var(--text-tertiary); }
    .search-field input:hover, .input-field:hover, .select-field:hover { border-color: var(--border-strong); }
    .search-field input:focus, .input-field:focus, .select-field:focus { border-color: var(--focus-ring); box-shadow: 0 0 0 3px var(--accent-soft); }

    .filter-chip {
      display: inline-flex;
      height: 32px;
      padding: 0 10px;
      align-items: center;
      color: var(--text-secondary);
      background: var(--p-transparent);
      border: 1px solid var(--p-transparent);
      border-radius: var(--radius-md);
      font-size: var(--font-sm);
      white-space: nowrap;
      cursor: pointer;
    }
    .filter-chip:hover { color: var(--text-primary); background: var(--surface-subtle); }
    .filter-chip[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); border-color: var(--accent-border); font-weight: var(--weight-medium); }

    .status-pill {
      display: inline-flex;
      height: 30px;
      padding: 0 9px;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-round);
      font-size: var(--font-xs);
      white-space: nowrap;
    }
    .status-dot { width: 6px; height: 6px; background: var(--success); border-radius: var(--radius-round); }
    .status-pill.warning .status-dot { background: var(--warning); }

    .checkbox-control { display: inline-flex; align-items: center; gap: 6px; color: var(--text-secondary); font-size: var(--font-sm); white-space: nowrap; }
    .checkbox-control input { width: 15px; height: 15px; accent-color: var(--accent); }

    .page-body {
      min-width: 0;
      min-height: 0;
      padding: var(--space-5) var(--space-6) var(--space-6);
      flex: 1;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border-default) var(--p-transparent);
    }
    .page-body.workspace { padding: var(--space-4); }

    .content-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--space-3); }
    .content-card {
      min-width: 0;
      padding: var(--space-4);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--card-radius);
    }
    .content-card.span-3 { grid-column: span 3; }
    .content-card.span-4 { grid-column: span 4; }
    .content-card.span-5 { grid-column: span 5; }
    .content-card.span-6 { grid-column: span 6; }
    .content-card.span-7 { grid-column: span 7; }
    .content-card.span-8 { grid-column: span 8; }
    .content-card.span-12 { grid-column: span 12; }
    .card-eyebrow { color: var(--text-tertiary); font-size: var(--font-xs); font-weight: var(--weight-medium); letter-spacing: 0.02em; }
    .metric { display: flex; margin-top: 8px; align-items: baseline; gap: 6px; }
    .metric strong { font-size: var(--font-2xl); font-weight: var(--weight-semibold); letter-spacing: -0.035em; }
    .metric span { color: var(--text-secondary); font-size: var(--font-xs); }
    .card-title { margin: 0; font-size: var(--font-md); font-weight: var(--weight-semibold); }
    .card-subtitle { margin: 5px 0 0; color: var(--text-secondary); font-size: var(--font-xs); }

    .data-list { display: grid; margin-top: var(--space-3); gap: var(--space-2); }
    .data-row {
      display: grid;
      min-height: 44px;
      padding: 0 var(--space-3);
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--space-3);
      background: var(--surface-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
    }
    .data-row strong { overflow: hidden; font-size: var(--font-sm); font-weight: var(--weight-medium); text-overflow: ellipsis; white-space: nowrap; }
    .data-row span { color: var(--text-secondary); font-size: var(--font-xs); white-space: nowrap; }
    .data-row .row-meta { display: flex; align-items: center; gap: 7px; }

    .private-toolbar {
      display: flex;
      min-height: 46px;
      padding: 6px var(--space-3);
      align-items: center;
      gap: var(--space-2);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-bottom: 0;
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }
    .private-label { margin-left: auto; color: var(--text-tertiary); font-size: var(--font-xs); }
    .workspace-panel {
      min-height: 330px;
      padding: var(--space-4);
      background: var(--surface);
      border: 1px solid var(--border-subtle);
      border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    }
    .workspace-columns { display: grid; height: 100%; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-3); }
    .workspace-pane { min-height: 250px; padding: var(--space-3); background: var(--surface-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); }

    .editor-tabs { display: flex; min-width: 0; flex: 1; gap: 4px; overflow: hidden; }
    .editor-tab { display: inline-flex; height: 30px; padding: 0 10px; align-items: center; color: var(--text-secondary); background: var(--surface-subtle); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); font-size: var(--font-xs); white-space: nowrap; }
    .editor-tab.active { color: var(--text-primary); background: var(--surface); border-color: var(--border-default); }
    .code-sample { margin: 0; color: var(--text-secondary); font: 12px/1.8 "SFMono-Regular", Consolas, monospace; white-space: pre-wrap; }

    .settings-list { display: grid; gap: var(--space-3); }
    .settings-section { overflow: hidden; background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
    .settings-section h2 { margin: 0; padding: var(--space-3) var(--space-4); background: var(--surface-subtle); border-bottom: 1px solid var(--border-subtle); font-size: var(--font-md); font-weight: var(--weight-semibold); }
    .setting-row { display: grid; min-height: 56px; padding: 0 var(--space-4); grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-bottom: 1px solid var(--border-subtle); }
    .setting-row:last-child { border-bottom: 0; }
    .setting-row strong { display: block; font-size: var(--font-sm); font-weight: var(--weight-medium); }
    .setting-row span { display: block; margin-top: 3px; color: var(--text-secondary); font-size: var(--font-xs); }

    .immersive-body { position: relative; padding: var(--space-6); }
    .home-hero { display: grid; min-height: 260px; padding: var(--space-8); align-content: center; background: var(--surface); border: 1px solid var(--accent-border); border-radius: var(--radius-xl); }
    .home-kicker { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: var(--font-xs); font-weight: var(--weight-semibold); letter-spacing: 0.12em; text-transform: uppercase; }
    .home-hero h1 { margin: var(--space-4) 0 0; font-size: 34px; font-weight: var(--weight-semibold); letter-spacing: -0.04em; }
    .home-hero p { max-width: 560px; margin: var(--space-3) 0 0; color: var(--text-secondary); font-size: var(--font-md); line-height: 1.7; }
    .home-cards { display: grid; margin-top: var(--space-3); grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-3); }
    .home-card { min-height: 130px; padding: var(--space-4); background: var(--surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
    .home-card iconify-icon { color: var(--accent); font-size: 20px; }
    .home-card strong { display: block; margin-top: var(--space-4); font-size: var(--font-md); }
    .home-card span { display: block; margin-top: 5px; color: var(--text-secondary); font-size: var(--font-xs); }

    .component-note {
      position: absolute;
      right: var(--space-5);
      bottom: var(--space-5);
      z-index: 15;
      display: inline-flex;
      height: 29px;
      padding: 0 10px;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      background: var(--surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-round);
      box-shadow: 0 6px 18px rgba(20, 34, 53, 0.08);
      font-size: var(--font-xs);
      pointer-events: none;
    }

    .toast {
      position: fixed;
      right: var(--space-6);
      bottom: var(--space-6);
      z-index: 80;
      display: flex;
      min-height: 42px;
      padding: 0 var(--space-4);
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      background: var(--popover-bg);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--menu-shadow);
      font-size: var(--font-sm);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--duration-normal), transform var(--duration-normal);
      pointer-events: none;
    }
    .toast.is-visible { opacity: 1; transform: translateY(0); }
    .toast iconify-icon { color: var(--success); font-size: 17px; }

    @container app (max-width: 1000px) {
      .app-layout { grid-template-columns: 148px minmax(0, 1fr); }
      .sidebar { padding-inline: var(--space-2); }
      .brand { padding-inline: var(--space-1); }
      .brand-mark { width: 22px; height: 22px; }
      .nav-item { min-height: 34px; padding-inline: 9px; gap: 8px; font-size: var(--font-sm); }
      .nav-item[aria-current="page"]::before { left: -5px; }
      .sidebar-footer { padding-inline: var(--space-1); }
      .sidebar-footer .shortcut { display: none; }
    }

    @container page (max-width: 790px) {
      .page-top { padding-inline: var(--space-4); }
      .page-header { min-height: 52px; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; }
      .page-icon { width: 34px; height: 34px; }
      .page-heading h1 { font-size: 18px; }
      .page-heading p { max-width: 420px; }
      .page-actions .btn.action-secondary { display: none; }
      .page-toolbar {
        display: grid;
        min-height: 88px;
        grid-template-columns: minmax(0, 1fr) auto;
        align-content: center;
      }
      .toolbar-primary { min-width: 0; grid-column: 1 / -1; }
      .toolbar-filters { grid-column: 1; }
      .toolbar-tail { grid-column: 2; }
      .search-field { max-width: none; }
      .input-field, .select-field { min-width: 0; }
      .content-card.span-3 { grid-column: span 6; }
      .content-card.span-4 { grid-column: span 6; }
      .content-card.span-5, .content-card.span-7 { grid-column: span 12; }
      .workspace-columns { grid-template-columns: 180px minmax(0, 1fr); }
    }

    @container page (max-width: 620px) {
      .page-header { grid-template-columns: 34px minmax(0, 1fr); padding: var(--space-2) 0; }
      .page-actions { grid-column: 1 / -1; padding-left: 44px; }
      .page-heading p { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
      .page-toolbar { grid-template-columns: minmax(0, 1fr); }
      .toolbar-filters, .toolbar-tail { grid-column: 1; }
      .toolbar-tail { justify-content: flex-start; }
      .content-card[class*="span-"] { grid-column: span 12; }
      .workspace-columns { grid-template-columns: 1fr; }
    }

    @media (max-width: 980px) {
      .prototype-toolbar { align-items: flex-start; flex-direction: column; }
      .prototype-controls { width: 100%; overflow-x: auto; }
      .preview-stage { min-height: calc(100vh - 112px); padding: var(--space-3); place-items: start center; }
    }

    body.embed { overflow: hidden; }
    body.embed .prototype-toolbar { display: none; }
    body.embed .preview-stage { min-height: 100vh; padding: 0; }
    body.embed .app-window { width: 100%; height: 100vh; min-height: 0; border: 0; border-radius: 0; box-shadow: none; }
    body.embed .component-note { display: none; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto; transition-duration: 0.01ms; }
    }
  </style>
</head>
<body>
  <header class="prototype-toolbar" aria-label="原型控制栏">
    <div class="prototype-title">
      <strong>全页面顶部组件 · 兼容性预览</strong>
      <span id="prototypeSummary">统一骨架，按页面组合标题、子导航与工具栏</span>
    </div>
    <div class="prototype-controls">
      <div class="control-group" aria-label="窗口尺寸">
        <button type="button" data-size="default" aria-pressed="true">
          <iconify-icon icon="tabler:device-desktop"></iconify-icon>
          默认窗口
        </button>
        <button type="button" data-size="compact" aria-pressed="false">
          <iconify-icon icon="tabler:layout-sidebar-left-collapse"></iconify-icon>
          最小窗口
        </button>
      </div>
      <button class="theme-button" id="themeToggle" type="button" aria-label="切换到暗色主题">
        <iconify-icon icon="tabler:moon"></iconify-icon>
        <span>暗色</span>
      </button>
    </div>
  </header>

  <main class="preview-stage">
    <section class="app-window" id="appWindow" aria-label="DevTools 软件页面原型">
      <div class="app-layout">
        <aside class="sidebar">
          <div class="brand">
            <span class="brand-mark"><iconify-icon icon="tabler:command"></iconify-icon></span>
            <span>DevTools</span>
          </div>
          <nav class="sidebar-nav" id="sidebarNav" aria-label="功能页面"></nav>
          <div class="sidebar-footer">
            <span><iconify-icon icon="tabler:components"></iconify-icon> PageTop</span>
            <span class="shortcut">14 / 14</span>
          </div>
        </aside>
        <section class="page-frame" id="pageFrame" aria-live="polite"></section>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <iconify-icon icon="tabler:circle-check-filled"></iconify-icon>
    <span></span>
  </div>

  <script>
    const pages = [
      {
        id: "home",
        label: "应用首页",
        icon: "tabler:home",
        variant: "immersive",
        body: "home"
      },
      {
        id: "run",
        label: "本地运行",
        icon: "tabler:player-play",
        description: "快速启动前端开发服务，管理模块、日志和本地地址",
        actions: [
          { label: "添加项目", icon: "tabler:plus", kind: "primary" },
          { label: "运行历史", icon: "tabler:history", kind: "secondary" }
        ],
        overflow: ["导入项目", "批量停止", "运行设置"],
        toolbar: {
          primary: [{ type: "search", placeholder: "搜索可运行项目…" }],
          filters: [{ type: "segments", values: ["全部", "运行中", "多模块", "单体项目"] }],
          actions: [{ type: "button", label: "全部停止", icon: "tabler:square-filled" }]
        },
        body: "metrics"
      },
      {
        id: "deploy",
        label: "部署面板",
        icon: "tabler:cloud-upload",
        description: "项目构建与 SFTP 部署管理",
        actions: [{ label: "添加项目", icon: "tabler:plus", kind: "primary" }],
        overflow: ["导入配置", "连接设置"],
        subnav: ["项目总览", "服务器管理", "部署历史"],
        toolbar: {
          primary: [{ type: "search", placeholder: "搜索部署项目…" }],
          filters: [{ type: "segments", values: ["全部", "已配置", "未配置"] }],
          status: [{ type: "status", label: "服务在线" }]
        },
        body: "list"
      },
      {
        id: "filetransfer",
        label: "文件传输",
        icon: "tabler:transfer",
        description: "在本地与远程服务器之间浏览和传输文件",
        actions: [{ label: "刷新", icon: "tabler:refresh", kind: "secondary" }],
        toolbar: {
          primary: [
            { type: "select", label: "同仁堂测试 · root@192.168.1.18:22" }
          ],
          actions: [{ type: "button", label: "连接", icon: "tabler:plug-connected", primary: true }],
          status: [{ type: "status", label: "未连接", tone: "warning" }]
        },
        body: "transfer"
      },
      {
        id: "terminal",
        label: "快捷命令",
        icon: "tabler:terminal-2",
        description: "预设常用 Shell 命令，一键执行",
        actions: [{ label: "添加命令", icon: "tabler:plus", kind: "primary" }],
        overflow: ["导入命令", "导出命令", "变量设置"],
        toolbar: {
          primary: [{ type: "checkbox", label: "使用 sudo" }],
          status: [{ type: "status", label: "配置已保存" }],
          actions: [{ type: "button", label: "保存", icon: "tabler:device-floppy" }]
        },
        body: "commands"
      },
      {
        id: "todo",
        label: "待办事项",
        icon: "tabler:checkbox",
        description: "轻量任务管理，按项目分组记录待办事项",
        actions: [{ label: "新建任务", icon: "tabler:plus", kind: "primary" }],
        overflow: ["清除已完成", "导出任务"],
        body: "todo"
      },
      {
        id: "report",
        label: "代码周报",
        icon: "tabler:clipboard-text",
        description: "基于 GitLab API 自动生成提交周报、增量加载与自动分类",
        body: "report"
      },
      {
        id: "notes",
        label: "工时内容",
        icon: "tabler:pencil",
        description: "记录每周工作内容",
        toolbar: {
          primary: [
            { type: "button", label: "上一周", icon: "tabler:arrow-left" },
            { type: "date", label: "本周 · 07-20 ～ 07-26" },
            { type: "button", label: "下一周", icon: "tabler:arrow-right" }
          ],
          filters: [{ type: "checkbox", label: "显示周末" }],
          actions: [{ type: "button", label: "参考周报", icon: "tabler:clipboard-text" }]
        },
        body: "timesheet"
      },
      {
        id: "notebook",
        label: "个人笔记",
        icon: "tabler:notebook",
        description: "个人知识库，记录笔记与备忘内容",
        body: "notebook",
        workspace: true
      },
      {
        id: "editor",
        label: "文件编辑器",
        icon: "tabler:file-pencil",
        description: "打开本地文件，语法高亮编辑",
        actions: [
          { label: "打开", icon: "tabler:folder-open", kind: "secondary" },
          { label: "保存", icon: "tabler:device-floppy", kind: "primary" }
        ],
        overflow: ["另存为", "重新载入", "编辑器设置"],
        body: "editor",
        workspace: true
      },
      {
        id: "ipcheck",
        label: "纯净检测",
        icon: "tabler:world-search",
        description: "查询公网 IP 风险、原生程度及各大主流业务场景适用评分",
        toolbar: {
          primary: [{ type: "input", placeholder: "输入 IP 地址或域名（例如：8.8.8.8）…" }],
          actions: [
            { type: "button", label: "检测", icon: "tabler:shield-search", primary: true },
            { type: "button", label: "我的 IP", icon: "tabler:current-location" }
          ]
        },
        body: "ip"
      },
      {
        id: "twofa",
        label: "2FA 账号列表",
        icon: "tabler:shield-lock",
        description: "本地加密保存密钥，按账号快速取码，支持批量导入与收藏",
        actions: [{ label: "添加账号", icon: "tabler:plus", kind: "primary" }],
        overflow: ["导入账号", "导出备份", "安全设置"],
        toolbar: {
          primary: [{ type: "search", placeholder: "搜索账号、平台或标签…" }],
          filters: [{ type: "segments", values: ["全部 12", "收藏 4", "工作 5"] }],
          status: [{ type: "status", label: "本地加密" }],
          actions: [{ type: "icon", label: "刷新验证码", icon: "tabler:refresh" }]
        },
        body: "twofa"
      },
      {
        id: "usage",
        label: "用量统计",
        icon: "tabler:chart-histogram",
        description: "AI 编程工具模型用量与成本统计",
        actions: [{ label: "重新扫描", icon: "tabler:scan", kind: "primary" }],
        overflow: ["订阅设置", "模型价格", "导出数据"],
        toolbar: {
          primary: [{ type: "segments", values: ["今天", "近 7 天", "本月", "全部"] }],
          filters: [{ type: "segments", values: ["全部应用", "Claude Code", "Codex"] }],
          status: [{ type: "status", label: "刚刚更新" }],
          actions: [{ type: "icon", label: "刷新统计", icon: "tabler:refresh" }]
        },
        body: "usage"
      },
      {
        id: "settings",
        label: "系统设置",
        icon: "tabler:settings",
        description: "全局配置与系统信息",
        body: "settings"
      }
    ];

    const state = {
      currentPage: "run",
      theme: "light",
      size: "default",
      menuOpen: false
    };

    const icon = (name) => `<iconify-icon icon="${name}" aria-hidden="true"></iconify-icon>`;

    function getCurrentPage() {
      return pages.find((page) => page.id === state.currentPage) || pages[1];
    }

    function renderSidebar() {
      const nav = document.getElementById("sidebarNav");
      nav.innerHTML = pages.map((page) => `
        <button class="nav-item" type="button" data-page="${page.id}" ${page.id === state.currentPage ? 'aria-current="page"' : ""}>
          ${icon(page.icon)}
          <span>${page.label}</span>
        </button>
      `).join("");
    }

    function renderAction(action) {
      const classes = ["btn", action.kind === "primary" ? "primary" : "", action.kind === "secondary" ? "action-secondary" : ""].filter(Boolean).join(" ");
      return `<button class="${classes}" type="button" data-demo="${action.label}">${action.icon ? icon(action.icon) : ""}<span>${action.label}</span></button>`;
    }

    function renderOverflow(items = []) {
      if (!items.length) return "";
      return `
        <button class="btn icon-only" id="overflowTrigger" type="button" aria-label="更多操作" aria-haspopup="menu" aria-expanded="${state.menuOpen}">
          ${icon("tabler:dots")}
        </button>
        <div class="overflow-menu ${state.menuOpen ? "is-open" : ""}" id="overflowMenu" role="menu">
          ${items.map((item, index) => `<button type="button" role="menuitem" data-demo="${item}">${icon(["tabler:download", "tabler:upload", "tabler:settings"][index % 3])}<span>${item}</span></button>`).join("")}
        </div>
      `;
    }

    function renderPageHeader(page) {
      const hasActions = page.actions?.length || page.overflow?.length;
      return `
        <div class="page-header">
          <span class="page-icon">${icon(page.icon)}</span>
          <div class="page-heading">
            <h1 id="page-title">${page.label}</h1>
            ${page.description ? `<p id="page-description">${page.description}</p>` : ""}
          </div>
          ${hasActions ? `<div class="page-actions">${(page.actions || []).map(renderAction).join("")}${renderOverflow(page.overflow)}</div>` : ""}
        </div>
      `;
    }

    function renderSubnav(items = []) {
      if (!items.length) return "";
      return `
        <div class="page-subnav" role="tablist" aria-label="页面导航">
          ${items.map((item, index) => `<button class="subnav-tab" type="button" role="tab" aria-selected="${index === 0}" tabindex="${index === 0 ? 0 : -1}" data-subnav>${icon(["tabler:box", "tabler:server", "tabler:history"][index] || "tabler:circle")}${item}</button>`).join("")}
        </div>
      `;
    }

    function renderSegments(control, controlIndex) {
      return control.values.map((value, index) => `<button class="filter-chip" type="button" aria-pressed="${index === 0}" data-segment-group="${controlIndex}">${value}</button>`).join("");
    }

    function renderControl(control, controlIndex) {
      switch (control.type) {
        case "search":
          return `<label class="search-field"><span class="sr-only">${control.placeholder}</span>${icon("tabler:search")}<input type="search" placeholder="${control.placeholder}"></label>`;
        case "input":
          return `<input class="input-field" type="text" aria-label="查询内容" placeholder="${control.placeholder}">`;
        case "select":
          return `<select class="select-field" aria-label="选择服务器"><option>${control.label}</option><option>生产环境 · deploy@10.0.0.8:22</option></select>`;
        case "segments":
          return renderSegments(control, controlIndex);
        case "button":
          return `<button class="btn ${control.primary ? "primary" : ""}" type="button" data-demo="${control.label}">${control.icon ? icon(control.icon) : ""}${control.label}</button>`;
        case "icon":
          return `<button class="btn icon-only" type="button" aria-label="${control.label}" title="${control.label}" data-demo="${control.label}">${icon(control.icon)}</button>`;
        case "status":
          return `<span class="status-pill ${control.tone === "warning" ? "warning" : ""}"><span class="status-dot"></span>${control.label}</span>`;
        case "checkbox":
          return `<label class="checkbox-control"><input type="checkbox">${control.label}</label>`;
        case "date":
          return `<span class="status-pill">${icon("tabler:calendar-week")}${control.label}</span>`;
        default:
          return "";
      }
    }

    function renderToolbar(toolbar) {
      if (!toolbar) return "";
      const primary = toolbar.primary || [];
      const filters = toolbar.filters || [];
      const tail = [...(toolbar.status || []), ...(toolbar.actions || [])];
      return `
        <div class="page-toolbar" role="group" aria-label="页面工具栏">
          ${primary.length ? `<div class="toolbar-primary">${primary.map(renderControl).join("")}</div>` : ""}
          ${filters.length ? `<div class="toolbar-filters">${filters.map(renderControl).join("")}</div>` : ""}
          ${tail.length ? `<div class="toolbar-tail">${tail.map(renderControl).join("")}</div>` : ""}
        </div>
      `;
    }

    function renderMetricsBody(page) {
      const bodyData = {
        run: [["可运行项目", "8", "2 个正在运行"], ["运行中", "2", "端口均正常"], ["今日启动", "11", "最近 14:28"], ["平均启动", "3.2s", "较昨日更快"]],
        usage: [["今日 Tokens", "2.48M", "+12.4%"], ["预估成本", "$6.82", "已同步价格"], ["总请求数", "284", "成功率 99.6%"], ["活跃应用", "2", "Claude · Codex"]]
      };
      const metrics = bodyData[page.id] || bodyData.run;
      return `
        <div class="content-grid">
          ${metrics.map((item) => `<article class="content-card span-3"><div class="card-eyebrow">${item[0]}</div><div class="metric"><strong>${item[1]}</strong></div><div class="card-subtitle">${item[2]}</div></article>`).join("")}
          <article class="content-card span-7"><h2 class="card-title">${page.id === "usage" ? "模型用量趋势" : "项目状态"}</h2><p class="card-subtitle">当前筛选范围内的实时概览</p><div class="data-list">${["personal-tools", "project-console", "design-preview"].map((name, index) => `<div class="data-row"><strong>${name}</strong><span>${page.id === "usage" ? ["1.26M", "782K", "438K"][index] : ["运行中 · :1420", "已停止", "运行中 · :18082"][index]}</span></div>`).join("")}</div></article>
          <article class="content-card span-5"><h2 class="card-title">最近活动</h2><p class="card-subtitle">页面顶部保持固定，正文独立滚动</p><div class="data-list"><div class="data-row"><strong>数据已更新</strong><span>刚刚</span></div><div class="data-row"><strong>本地缓存可用</strong><span>正常</span></div></div></article>
        </div>
      `;
    }

    function renderListBody(page) {
      const rows = page.id === "deploy"
        ? [["personal-tools", "测试服务器 · 已配置"], ["admin-console", "生产服务器 · 已配置"], ["website-next", "尚未配置服务器"]]
        : [["项目 Alpha", "就绪"], ["项目 Beta", "等待配置"], ["项目 Gamma", "最近更新"]];
      return `<div class="content-grid"><article class="content-card span-8"><h2 class="card-title">${page.id === "deploy" ? "部署项目" : "项目列表"}</h2><div class="data-list">${rows.map((row) => `<div class="data-row"><strong>${row[0]}</strong><span>${row[1]}</span></div>`).join("")}</div></article><article class="content-card span-4"><h2 class="card-title">运行概览</h2><div class="metric"><strong>3</strong><span>个项目</span></div><p class="card-subtitle">所有配置状态清晰可见</p></article></div>`;
    }

    function renderWorkspaceBody(kind) {
      if (kind === "editor") {
        return `<div class="private-toolbar"><div class="editor-tabs"><span class="editor-tab active">app.js</span><span class="editor-tab">home.css</span><span class="editor-tab">migration-plan.md</span></div><span class="private-label">编辑器私有标签栏</span></div><div class="workspace-panel"><pre class="code-sample">const pageTop = createPageTop({\n  title: '文件编辑器',\n  actions: ['open', 'save'],\n  bodyMode: 'workspace'\n})</pre></div>`;
      }
      return `<div class="private-toolbar"><label class="search-field"><span class="sr-only">搜索笔记</span>${icon("tabler:search")}<input type="search" placeholder="搜索笔记…"></label><button class="btn primary" type="button" data-demo="新建笔记">${icon("tabler:plus")}新建</button><span class="private-label">笔记工作区私有工具栏</span></div><div class="workspace-panel"><div class="workspace-columns"><div class="workspace-pane"><div class="data-list"><div class="data-row"><strong>公司账号</strong><span>今天</span></div><div class="data-row"><strong>个人使用</strong><span>周一</span></div></div></div><div class="workspace-pane"><h2 class="card-title">笔记内容</h2><p class="card-subtitle">工作区工具条不进入全局 PageTop，避免组件承担业务职责。</p></div></div></div>`;
    }

    function renderGenericBody(page) {
      switch (page.body) {
        case "metrics":
        case "usage": return renderMetricsBody(page);
        case "list": return renderListBody(page);
        case "notebook":
        case "editor": return renderWorkspaceBody(page.body);
        case "settings":
          return `<div class="settings-list"><section class="settings-section"><h2>通用</h2><div class="setting-row"><div><strong>Sidecar 状态</strong><span>Node.js 后端服务进程</span></div><span class="status-pill"><span class="status-dot"></span>运行中</span></div><div class="setting-row"><div><strong>外观主题</strong><span>跟随系统或手动选择</span></div><button class="btn" type="button" data-demo="外观设置">跟随系统</button></div></section><section class="settings-section"><h2>数据与安全</h2><div class="setting-row"><div><strong>本地数据</strong><span>所有敏感数据仅保存在设备中</span></div><span>正常</span></div></section></div>`;
        case "transfer":
          return `<div class="content-grid"><article class="content-card span-6"><h2 class="card-title">${icon("tabler:device-desktop")} 本地</h2><div class="data-list"><div class="data-row"><strong>design-preview</strong><span>文件夹</span></div><div class="data-row"><strong>src</strong><span>文件夹</span></div></div></article><article class="content-card span-6"><h2 class="card-title">${icon("tabler:server")} 远程服务器</h2><p class="card-subtitle">连接后显示目录内容</p><div class="data-list"><div class="data-row"><strong>等待连接</strong><span>—</span></div></div></article></div>`;
        case "commands":
          return `<div class="content-grid">${[["tabler:brand-git", "Git 状态", "git status"], ["tabler:refresh", "同步分支", "git fetch --all"], ["tabler:package", "安装依赖", "npm install"]].map((item) => `<article class="content-card span-4">${icon(item[0])}<h2 class="card-title" style="margin-top:12px">${item[1]}</h2><p class="card-subtitle">${item[2]}</p></article>`).join("")}</div>`;
        case "todo":
          return `<div class="content-grid">${[["待处理", "3"], ["进行中", "1"], ["已完成", "8"]].map((column, index) => `<article class="content-card span-4"><h2 class="card-title">${column[0]} · ${column[1]}</h2><div class="data-list"><div class="data-row"><strong>${["整理公共组件清单", "迁移首页数据层", "完成顶部审计"][index]}</strong><span>${["今天", "处理中", "已完成"][index]}</span></div></div></article>`).join("")}</div>`;
        case "report":
          return `<div class="content-grid"><article class="content-card span-5"><h2 class="card-title">配置信息</h2><div class="data-list"><div class="data-row"><strong>GitLab 连接</strong><span>已配置</span></div><div class="data-row"><strong>作者</strong><span>ldy</span></div></div></article><article class="content-card span-7"><h2 class="card-title">本周周报预览</h2><p class="card-subtitle">配置区域属于正文，顶部只保留页面身份。</p></article></div>`;
        case "timesheet":
          return `<div class="content-card"><h2 class="card-title">本周记录</h2><div class="data-list">${["周一 · Vue 迁移方案梳理", "周二 · 页面顶部组件审计", "周三 · 公共组件原型验证", "周四 · 样式 Token 设计"].map((item, index) => `<div class="data-row"><strong>${item}</strong><span>${["7.5h", "8h", "6.5h", "进行中"][index]}</span></div>`).join("")}</div></div>`;
        case "ip":
          return `<div class="content-grid"><article class="content-card span-5"><div class="card-eyebrow">当前公网 IP</div><div class="metric"><strong>203.0.113.24</strong></div><p class="card-subtitle">新加坡 · 数据中心网络</p></article><article class="content-card span-7"><h2 class="card-title">检测结果</h2><div class="data-list"><div class="data-row"><strong>风险评分</strong><span>低风险 · 92</span></div><div class="data-row"><strong>原生程度</strong><span>良好</span></div></div></article></div>`;
        case "twofa":
          return `<div class="content-grid">${[["GitHub", "personal@example.com", "248 391"], ["OpenAI", "work@example.com", "670 155"], ["Cloudflare", "admin@example.com", "903 442"]].map((item) => `<article class="content-card span-4"><div class="card-eyebrow">${item[0]}</div><h2 class="card-title" style="margin-top:8px">${item[1]}</h2><div class="metric"><strong>${item[2]}</strong><span>24s</span></div></article>`).join("")}</div>`;
        default: return renderListBody(page);
      }
    }

    function renderHome() {
      return `<div class="page-body immersive-body"><section class="home-hero"><div class="home-kicker">${icon("tabler:sparkles")} Personal workspace · overview</div><h1>下午好，ldy</h1><p>首页继续保持沉浸式布局，不强行套用工具页面顶部；侧边栏、主题与页面骨架仍然共享。</p></section><div class="home-cards"><article class="home-card">${icon("tabler:chart-bar")}<strong>今日用量</strong><span>2.48M Tokens · 数据已同步</span></article><article class="home-card">${icon("tabler:shield-check")}<strong>IP 纯净度</strong><span>低风险 · 当前网络正常</span></article><article class="home-card">${icon("tabler:sun-high")}<strong>今日状态</strong><span>适合把复杂事情做简单</span></article></div><span class="component-note">${icon("tabler:layout-dashboard")} immersive 例外</span></div>`;
    }

    function renderPage() {
      const page = getCurrentPage();
      const frame = document.getElementById("pageFrame");
      state.menuOpen = false;
      if (page.variant === "immersive") {
        frame.innerHTML = renderHome();
      } else {
        frame.innerHTML = `
          <header class="page-top" aria-labelledby="page-title" ${page.description ? 'aria-describedby="page-description"' : ""}>
            ${renderPageHeader(page)}
            ${renderSubnav(page.subnav)}
            ${renderToolbar(page.toolbar)}
          </header>
          <main class="page-body ${page.workspace ? "workspace" : ""}">${renderGenericBody(page)}</main>
          <span class="component-note">${icon("tabler:components")} ${getCompositionLabel(page)}</span>
        `;
      }
      updateSummary(page);
      bindPageInteractions();
    }

    function getCompositionLabel(page) {
      const parts = ["PageHeader"];
      if (page.subnav) parts.push("Subnav");
      if (page.toolbar) parts.push("Toolbar");
      return parts.join(" + ");
    }

    function updateSummary(page) {
      const summary = document.getElementById("prototypeSummary");
      summary.textContent = page.variant === "immersive"
        ? `${page.label} · 沉浸式例外，不渲染普通 PageTop`
        : `${page.label} · ${getCompositionLabel(page)} · 正文独立滚动`;
      document.title = `${page.label} · PageTop 组件预览`;
    }

    function bindPageInteractions() {
      const trigger = document.getElementById("overflowTrigger");
      trigger?.addEventListener("click", (event) => {
        event.stopPropagation();
        state.menuOpen = !state.menuOpen;
        const menu = document.getElementById("overflowMenu");
        menu?.classList.toggle("is-open", state.menuOpen);
        trigger.setAttribute("aria-expanded", String(state.menuOpen));
        if (state.menuOpen) menu?.querySelector("button")?.focus();
      });

      document.querySelectorAll("[data-segment-group]").forEach((button) => {
        button.addEventListener("click", () => {
          const group = button.dataset.segmentGroup;
          button.parentElement.querySelectorAll(`[data-segment-group="${group}"]`).forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        });
      });

      document.querySelectorAll("[data-subnav]").forEach((tab) => {
        tab.addEventListener("click", () => selectSubnav(tab));
        tab.addEventListener("keydown", handleSubnavKeys);
      });

      document.querySelectorAll("[data-demo]").forEach((button) => {
        button.addEventListener("click", () => {
          closeOverflow();
          showToast(`${button.dataset.demo} · 原型交互已触发`);
        });
      });
    }

    function selectSubnav(target) {
      const tabs = [...target.parentElement.querySelectorAll("[data-subnav]")];
      tabs.forEach((tab) => {
        const selected = tab === target;
        tab.setAttribute("aria-selected", String(selected));
        tab.tabIndex = selected ? 0 : -1;
      });
    }

    function handleSubnavKeys(event) {
      if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
      const tabs = [...event.currentTarget.parentElement.querySelectorAll("[data-subnav]")];
      const current = tabs.indexOf(event.currentTarget);
      let next = current;
      if (event.key === "ArrowLeft") next = (current - 1 + tabs.length) % tabs.length;
      if (event.key === "ArrowRight") next = (current + 1) % tabs.length;
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = tabs.length - 1;
      event.preventDefault();
      selectSubnav(tabs[next]);
      tabs[next].focus();
    }

    function closeOverflow() {
      state.menuOpen = false;
      document.getElementById("overflowMenu")?.classList.remove("is-open");
      document.getElementById("overflowTrigger")?.setAttribute("aria-expanded", "false");
    }

    let toastTimer;
    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.querySelector("span").textContent = message;
      toast.classList.add("is-visible");
      window.clearTimeout(toastTimer);
      toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 1800);
    }

    function setPage(pageId, updateHash = true) {
      if (!pages.some((page) => page.id === pageId)) return;
      state.currentPage = pageId;
      renderSidebar();
      renderPage();
      if (updateHash) history.replaceState(null, "", `#${pageId}`);
    }

    function setTheme(theme) {
      state.theme = theme;
      document.documentElement.dataset.theme = theme;
      const toggle = document.getElementById("themeToggle");
      const isDark = theme === "dark";
      toggle.innerHTML = `${icon(isDark ? "tabler:sun-high" : "tabler:moon")}<span>${isDark ? "亮色" : "暗色"}</span>`;
      toggle.setAttribute("aria-label", `切换到${isDark ? "亮色" : "暗色"}主题`);
    }

    function setSize(size) {
      state.size = size;
      document.getElementById("appWindow").classList.toggle("is-compact", size === "compact");
      document.querySelectorAll("[data-size]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.size === size)));
    }

    document.getElementById("sidebarNav").addEventListener("click", (event) => {
      const button = event.target.closest("[data-page]");
      if (button) setPage(button.dataset.page);
    });

    document.getElementById("sidebarNav").addEventListener("keydown", (event) => {
      if (!["ArrowUp", "ArrowDown", "Home", "End"].includes(event.key)) return;
      const buttons = [...event.currentTarget.querySelectorAll("[data-page]")];
      const current = buttons.indexOf(document.activeElement);
      if (current < 0) return;
      let next = current;
      if (event.key === "ArrowUp") next = (current - 1 + buttons.length) % buttons.length;
      if (event.key === "ArrowDown") next = (current + 1) % buttons.length;
      if (event.key === "Home") next = 0;
      if (event.key === "End") next = buttons.length - 1;
      event.preventDefault();
      buttons[next].focus();
    });

    document.querySelectorAll("[data-size]").forEach((button) => button.addEventListener("click", () => setSize(button.dataset.size)));
    document.getElementById("themeToggle").addEventListener("click", () => setTheme(state.theme === "light" ? "dark" : "light"));

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".page-actions")) closeOverflow();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeOverflow();
    });

    window.addEventListener("hashchange", () => setPage(location.hash.slice(1) || "run", false));

    const params = new URLSearchParams(location.search);
    if (params.get("embed") === "1") document.body.classList.add("embed");
    if (params.get("theme") === "dark") state.theme = "dark";
    state.currentPage = pages.some((page) => page.id === location.hash.slice(1)) ? location.hash.slice(1) : "run";
    setTheme(state.theme);
    setSize(params.get("size") === "compact" ? "compact" : "default");
    renderSidebar();
    renderPage();
  </script>
</body>
</html>
