<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTools · 个人笔记 L2 原型</title>
  <link rel="stylesheet" href="./home-reimagine-common.css">
  <style>
    :root {
      --notebook-accent: #818cf8;
      --notebook-accent-soft: color-mix(in srgb, var(--notebook-accent) 11%, transparent);
      --notebook-success: #4ade80;
      --notebook-danger: #f87171;
      --notebook-list-width: 292px;
      --notebook-gutter: clamp(12px, 1.4vw, 22px);
    }

    body[data-theme="light"] {
      --notebook-accent: #4f46e5;
      --notebook-success: #15803d;
      --notebook-danger: #b91c1c;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .notebook-preview-main {
      overflow: hidden;
      background:
        radial-gradient(circle at 96% 2%, color-mix(in srgb, var(--action) 6%, transparent), transparent 25%),
        var(--page);
    }

    .notebook-page {
      display: grid;
      width: 100%;
      height: 100%;
      min-width: 0;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .notebook-page-header {
      display: grid;
      min-height: 78px;
      grid-template-columns: minmax(180px, auto) minmax(220px, 360px) auto;
      align-items: center;
      gap: 18px;
      padding: 12px var(--notebook-gutter);
      background: color-mix(in srgb, var(--surface) 91%, transparent);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(18px);
    }

    .notebook-heading {
      min-width: 0;
    }

    .notebook-title-line {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .notebook-title-mark {
      width: 8px;
      height: 8px;
      flex: none;
      border-radius: 50%;
      background: var(--notebook-accent);
      box-shadow: 0 0 14px color-mix(in srgb, var(--notebook-accent) 48%, transparent);
    }

    .notebook-page-header h1 {
      margin: 0;
      color: var(--text);
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -.025em;
    }

    .notebook-heading p {
      margin: 4px 0 0 18px;
      color: var(--text-subtle);
      font-size: 11px;
    }

    .notebook-search {
      position: relative;
      min-width: 0;
    }

    .notebook-search input {
      width: 100%;
      height: 38px;
      padding: 0 72px 0 13px;
      color: var(--text);
      background: color-mix(in srgb, var(--surface-raised) 54%, transparent);
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      transition: border-color .16s ease, box-shadow .16s ease, background-color .16s ease;
    }

    .notebook-search input:focus {
      background: var(--surface);
      border-color: color-mix(in srgb, var(--notebook-accent) 58%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--notebook-accent) 12%, transparent);
    }

    .search-key {
      position: absolute;
      top: 50%;
      right: 10px;
      transform: translateY(-50%);
      color: var(--text-subtle);
      font-family: "SF Mono", Menlo, monospace;
      font-size: 9px;
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .theme-control {
      display: inline-flex;
      padding: 3px;
      background: color-mix(in srgb, var(--surface-raised) 58%, transparent);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .theme-option {
      min-height: 30px;
      padding: 0 9px;
      color: var(--text-subtle);
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 10px;
    }

    .theme-option.active {
      color: var(--text);
      background: var(--surface);
      box-shadow: 0 1px 6px rgba(0, 0, 0, .12);
    }

    .prototype-state {
      height: 36px;
      max-width: 112px;
      padding: 0 28px 0 10px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      font-size: 10px;
    }

    .primary-button,
    .secondary-button,
    .quiet-action {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      padding: 0 13px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: color .16s ease, border-color .16s ease, background-color .16s ease, transform .16s ease;
    }

    .primary-button {
      color: #fff;
      background: linear-gradient(135deg, var(--action), color-mix(in srgb, var(--action) 76%, #a78bfa));
      border: 1px solid color-mix(in srgb, var(--action) 82%, white);
      box-shadow: 0 8px 20px color-mix(in srgb, var(--action) 20%, transparent);
      font-weight: 650;
    }

    .primary-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--action) 26%, transparent);
    }

    .secondary-button,
    .quiet-action {
      color: var(--text-muted);
      background: color-mix(in srgb, var(--surface-raised) 45%, transparent);
      border: 1px solid var(--border);
    }

    .secondary-button:hover,
    .quiet-action:hover {
      color: var(--notebook-accent);
      background: var(--notebook-accent-soft);
      border-color: color-mix(in srgb, var(--notebook-accent) 34%, var(--border));
    }

    .notebook-stage {
      min-height: 0;
      padding: var(--notebook-gutter);
      overflow: hidden;
    }

    .notebook-workspace {
      display: grid;
      width: 100%;
      height: 100%;
      min-width: 0;
      grid-template-columns: var(--notebook-list-width) minmax(0, 1fr);
      overflow: hidden;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    body.list-collapsed .notebook-workspace {
      grid-template-columns: minmax(0, 1fr);
    }

    body.list-collapsed .notebook-list-panel {
      display: none;
    }

    .notebook-list-panel {
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      background: color-mix(in srgb, var(--surface-raised) 34%, var(--surface));
      border-right: 1px solid var(--border);
    }

    .list-toolbar {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-bottom: 1px solid var(--border);
    }

    .list-toolbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .list-toolbar strong {
      color: var(--text);
      font-size: 12px;
      font-weight: 680;
    }

    .note-count {
      color: var(--text-subtle);
      font-size: 10px;
    }

    .list-filter {
      display: inline-flex;
      padding: 3px;
      background: color-mix(in srgb, var(--surface) 72%, transparent);
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .filter-button {
      min-height: 28px;
      padding: 0 9px;
      color: var(--text-subtle);
      background: transparent;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-size: 10px;
    }

    .filter-button.active {
      color: var(--notebook-accent);
      background: var(--notebook-accent-soft);
    }

    .sort-select {
      height: 34px;
      min-width: 98px;
      padding: 0 26px 0 9px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      font-size: 10px;
    }

    .note-list {
      display: grid;
      align-content: start;
      gap: 7px;
      min-height: 0;
      padding: 10px;
      overflow-y: auto;
    }

    .note-item {
      position: relative;
      display: grid;
      min-width: 0;
      gap: 6px;
      padding: 12px 13px;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 11px;
      cursor: pointer;
      text-align: left;
      transition: color .16s ease, background-color .16s ease, border-color .16s ease, transform .16s ease;
    }

    .note-item:hover {
      color: var(--text);
      background: color-mix(in srgb, var(--surface-raised) 62%, transparent);
      border-color: var(--border);
      transform: translateY(-1px);
    }

    .note-item.active {
      color: var(--text);
      background: linear-gradient(135deg, color-mix(in srgb, var(--notebook-accent) 11%, transparent), color-mix(in srgb, var(--surface) 68%, transparent));
      border-color: color-mix(in srgb, var(--notebook-accent) 32%, var(--border));
      box-shadow: 0 8px 22px color-mix(in srgb, var(--notebook-accent) 7%, transparent);
    }

    .note-item.active::before {
      content: "";
      position: absolute;
      top: 13px;
      bottom: 13px;
      left: -1px;
      width: 3px;
      border-radius: 0 999px 999px 0;
      background: var(--notebook-accent);
    }

    .note-title-row,
    .note-meta-row {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .note-title {
      overflow: hidden;
      color: currentColor;
      font-size: 12px;
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .pin-label {
      flex: none;
      color: var(--warning);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .06em;
    }

    .note-preview {
      display: -webkit-box;
      overflow: hidden;
      color: var(--text-subtle);
      font-size: 10px;
      line-height: 1.5;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .note-meta-row {
      color: var(--text-subtle);
      font-size: 9px;
    }

    .list-empty {
      display: grid;
      min-height: 160px;
      place-items: center;
      padding: 20px;
      color: var(--text-subtle);
      font-size: 11px;
      text-align: center;
    }

    .notebook-editor-panel {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
    }

    .editor-toolbar {
      display: flex;
      grid-row: 1;
      min-height: 56px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 18px;
      border-bottom: 1px solid var(--border);
    }

    .editor-context {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
    }

    .editor-context-copy {
      display: grid;
      min-width: 0;
      gap: 2px;
    }

    .editor-context-copy strong {
      overflow: hidden;
      color: var(--text);
      font-size: 11px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .editor-context-copy span {
      color: var(--text-subtle);
      font-size: 9px;
    }

    .save-state {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      gap: 7px;
      padding: 0 9px;
      color: var(--text-subtle);
      background: color-mix(in srgb, var(--surface-raised) 45%, transparent);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 9px;
      white-space: nowrap;
    }

    .save-state i {
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: var(--notebook-success);
      box-shadow: 0 0 8px color-mix(in srgb, var(--notebook-success) 46%, transparent);
    }

    .save-state[data-state="dirty"] i,
    .save-state[data-state="saving"] i {
      background: var(--warning);
      box-shadow: 0 0 8px color-mix(in srgb, var(--warning) 46%, transparent);
    }

    .save-state[data-state="saving"] i {
      animation: savePulse .8s ease-in-out infinite;
    }

    .save-state[data-state="error"] {
      color: var(--notebook-danger);
      border-color: color-mix(in srgb, var(--notebook-danger) 30%, var(--border));
    }

    .save-state[data-state="error"] i {
      background: var(--notebook-danger);
      box-shadow: 0 0 8px color-mix(in srgb, var(--notebook-danger) 42%, transparent);
    }

    @keyframes savePulse {
      50% { opacity: .35; transform: scale(.78); }
    }

    .editor-actions {
      position: relative;
      display: flex;
      flex: none;
      align-items: center;
      gap: 7px;
    }

    .quiet-action {
      min-height: 32px;
      padding-inline: 10px;
      font-size: 10px;
    }

    .quiet-action.active {
      color: var(--warning);
      background: color-mix(in srgb, var(--warning) 9%, transparent);
      border-color: color-mix(in srgb, var(--warning) 28%, var(--border));
    }

    .more-menu {
      position: absolute;
      top: 39px;
      right: 0;
      z-index: 30;
      display: none;
      width: 214px;
      padding: 6px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 11px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .22);
    }

    .more-menu.open {
      display: grid;
    }

    .menu-button {
      display: flex;
      min-height: 34px;
      align-items: center;
      justify-content: space-between;
      padding: 0 9px;
      color: var(--text-muted);
      background: transparent;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      font-size: 10px;
      text-align: left;
    }

    .menu-button:hover {
      color: var(--text);
      background: var(--surface-raised);
    }

    .menu-button.danger {
      color: var(--notebook-danger);
    }

    .menu-key {
      color: var(--text-subtle);
      font-family: "SF Mono", Menlo, monospace;
      font-size: 8px;
    }

    .menu-note {
      color: var(--text-subtle);
      font-size: 8px;
    }

    .editor-alert {
      display: none;
      grid-row: 2;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 8px 18px;
      color: var(--notebook-danger);
      background: color-mix(in srgb, var(--notebook-danger) 8%, transparent);
      border-bottom: 1px solid color-mix(in srgb, var(--notebook-danger) 20%, var(--border));
      font-size: 10px;
    }

    .editor-alert.visible {
      display: flex;
    }

    .editor-alert button {
      min-height: 26px;
      padding: 0 9px;
      color: var(--notebook-danger);
      background: transparent;
      border: 1px solid color-mix(in srgb, var(--notebook-danger) 30%, var(--border));
      border-radius: 7px;
      cursor: pointer;
      font-size: 9px;
    }

    .editor-document {
      display: flex;
      grid-row: 3;
      min-height: 0;
      overflow: hidden;
    }

    .document-inner {
      display: flex;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      width: min(100%, 840px);
      margin: 0 auto;
      padding: clamp(24px, 4.3vh, 44px) clamp(26px, 4vw, 64px) 32px;
      overflow: hidden;
    }

    .document-title {
      width: 100%;
      padding: 0 0 13px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--border);
      outline: none;
      font-size: clamp(22px, 2.1vw, 30px);
      font-weight: 720;
      letter-spacing: -.035em;
    }

    .document-title::placeholder {
      color: var(--text-subtle);
      opacity: .55;
    }

    .document-content {
      flex: 1;
      min-height: 0;
      padding-top: 13px;
      color: var(--text);
      outline: none;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.82;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .document-content:empty::before {
      content: attr(data-placeholder);
      color: var(--text-subtle);
      opacity: .55;
    }

    .document-content h2 {
      margin: 21px 0 7px;
      font-size: 15px;
      font-weight: 700;
    }

    .document-content p {
      margin: 0 0 10px;
    }

    .document-content ul {
      margin: 5px 0 12px;
      padding-left: 20px;
    }

    .document-content ol {
      margin: 5px 0 12px;
      padding-left: 20px;
    }

    .document-content blockquote {
      margin: 12px 0;
      padding: 8px 12px;
      color: var(--text-muted);
      background: color-mix(in srgb, var(--surface-raised) 55%, transparent);
      border-left: 3px solid var(--notebook-accent);
      border-radius: 0 8px 8px 0;
    }

    .document-content pre,
    .document-content code {
      font-family: "SF Mono", Menlo, Consolas, monospace;
    }

    .document-content pre {
      margin: 12px 0;
      padding: 11px 13px;
      overflow-x: auto;
      background: color-mix(in srgb, var(--surface-raised) 70%, transparent);
      border: 1px solid var(--border);
      border-radius: 9px;
      white-space: pre-wrap;
    }

    .document-content table {
      width: 100%;
      margin: 12px 0;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .document-content th,
    .document-content td {
      padding: 8px 10px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .document-content tr:last-child > * {
      border-bottom: 0;
    }

    .document-content tr > *:last-child {
      border-right: 0;
    }

    .document-content table[data-notebook-block="credential"] {
      table-layout: fixed;
      min-width: max(100%, calc(var(--credential-columns, 2) * 150px));
    }

    .document-content table[data-notebook-block="credential"] th {
      color: var(--text-muted);
      background: color-mix(in srgb, var(--surface-raised) 42%, transparent);
      font-weight: 650;
    }

    .document-content table[data-notebook-block="credential"] th[data-credential-project] {
      padding: 11px 12px;
      color: var(--text);
      background:
        linear-gradient(90deg, color-mix(in srgb, var(--notebook-accent) 10%, transparent), transparent 62%),
        color-mix(in srgb, var(--surface-raised) 52%, transparent);
      font-size: 13px;
      letter-spacing: -.01em;
    }

    .document-content table[data-notebook-block="credential"] thead tr:last-child th {
      padding-block: 7px;
      color: var(--text-subtle);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .document-content table[data-notebook-block="credential"] td[data-credential-value] {
      position: relative;
      padding-right: 68px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      transition: color .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .document-content table[data-notebook-block="credential"]:not([data-editing="true"]) td[data-credential-value] {
      cursor: pointer;
      outline: none;
    }

    .document-content table[data-notebook-block="credential"]:not([data-editing="true"]) td[data-credential-value]::after {
      position: absolute;
      top: 50%;
      right: 10px;
      padding: 3px 6px;
      color: var(--text-subtle);
      background: color-mix(in srgb, var(--surface-raised) 70%, transparent);
      border: 1px solid transparent;
      border-radius: 5px;
      content: "复制";
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      font-size: 8px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-50%);
      transition: opacity .16s ease, color .16s ease, border-color .16s ease;
    }

    .document-content table[data-notebook-block="credential"]:not([data-editing="true"]) td[data-credential-value]:hover,
    .document-content table[data-notebook-block="credential"]:not([data-editing="true"]) td[data-credential-value]:focus-visible {
      color: var(--notebook-accent);
      background: color-mix(in srgb, var(--notebook-accent) 7%, transparent);
      box-shadow: inset 3px 0 0 color-mix(in srgb, var(--notebook-accent) 52%, transparent);
    }

    .document-content table[data-notebook-block="credential"]:not([data-editing="true"]) td[data-credential-value]:hover::after,
    .document-content table[data-notebook-block="credential"]:not([data-editing="true"]) td[data-credential-value]:focus-visible::after,
    .document-content table[data-notebook-block="credential"]:not([data-editing="true"]) td[data-credential-value][data-copy-state="done"]::after {
      opacity: 1;
    }

    .document-content table[data-notebook-block="credential"]:not([data-editing="true"]) td[data-credential-value][data-copy-state="done"]::after {
      color: var(--notebook-success);
      border-color: color-mix(in srgb, var(--notebook-success) 28%, transparent);
      content: "已复制";
    }

    .document-content table[data-notebook-block="credential"][data-editing="true"] {
      border-color: color-mix(in srgb, var(--notebook-accent) 38%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--notebook-accent) 7%, transparent);
    }

    .document-content table[data-notebook-block="credential"][data-editing="true"] td[data-credential-value] {
      cursor: text;
      background: color-mix(in srgb, var(--notebook-accent) 4%, transparent);
    }

    .document-content table[data-notebook-block="credential"][data-editing="true"] th[data-credential-project] {
      cursor: text;
      box-shadow: inset 3px 0 0 color-mix(in srgb, var(--notebook-accent) 48%, transparent);
    }

    .document-content table[data-notebook-block="credential"][data-editing="true"] th[data-credential-field] {
      cursor: text;
      outline: none;
      transition: color .16s ease, background .16s ease, box-shadow .16s ease;
    }

        const allowedTags = new Set([
          'P', 'DIV', 'BR', 'H2', 'H3', 'UL', 'OL', 'LI',

          'BLOCKQUOTE', 'PRE', 'CODE', 'TABLE', 'THEAD',
          'TBODY', 'TR', 'TH', 'TD'
        ]);

        template.innerHTML = html;
        template.content.querySelectorAll('script, style, iframe, object, embed, form').forEach((element) => element.remove());

        Array.from(template.content.querySelectorAll('*')).reverse().forEach((element) => {
          const tag = element.tagName;

          }

          Array.from(element.attributes).forEach((attribute) => element.removeAttribute(attribute.name));

          if (tag === 'A' && /^https?:\/\//i.test(href)) {
            element.setAttribute('href', href);
            element.setAttribute('target', '_blank');
            element.setAttribute('rel', 'noreferrer noopener');
          }
          if (credentialBlock) element.setAttribute('data-notebook-block', 'credential');
          if (credentialValue) {
            element.setAttribute('data-credential-value', '');
          }
          if (credentialProject) {
            element.setAttribute('data-credential-project', '');
            element.setAttribute('colspan', String(credentialColspan));
          }
          if (credentialField) element.setAttribute('data-credential-field', '');
        });

        return template.innerHTML;
      }

      function safeStandaloneUrl(text) {
        const value = text.trim();
        if (!/^https?:\/\/\S+$/i.test(value)) return null;
        try {
          const url = new URL(value);
          return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null;
        } catch {
          return null;
        }
      }

      function createStandaloneLink(url, label = url) {
        const anchor = document.createElement('a');
        anchor.href = url;
        anchor.target = '_blank';
        anchor.rel = 'noreferrer noopener';
        anchor.textContent = label;
        return anchor;
      }

      function plainTextToHtml(text) {
        return text.split(/\r?\n/).map((line) => {
          const paragraph = document.createElement('p');
          const url = safeStandaloneUrl(line);
          if (url) paragraph.append(createStandaloneLink(url, line.trim()));
          else if (line) paragraph.textContent = line;
          else paragraph.append(document.createElement('br'));
          return paragraph.outerHTML;
        }).join('');
      }

      function linkifyStandaloneUrlBlocks(root = contentEditor) {
        let converted = 0;
        root.querySelectorAll('p, div, li').forEach((block) => {
          if (block.closest('table[data-notebook-block="credential"]') || block.querySelector('a, p, div, li')) return;
          const url = safeStandaloneUrl(block.textContent || '');
          if (!url) return;
          const label = block.textContent.trim();
          block.replaceChildren(createStandaloneLink(url, label));
          converted += 1;
        });
        return converted;
      }

      function currentEditorBlock() {
        const selection = window.getSelection();
        const node = selection?.anchorNode;
        const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        const block = element?.closest('p, div, li');
        return block && contentEditor.contains(block) ? block : null;
      }

      function convertCurrentUrlLineOnEnter() {
        const block = currentEditorBlock();
        if (!block || block.closest('table[data-notebook-block="credential"]') || block.querySelector('a, p, div, li')) return false;
        const url = safeStandaloneUrl(block.textContent || '');
        if (!url) return false;

        const label = block.textContent.trim();
        block.replaceChildren(createStandaloneLink(url, label));
        const nextLine = document.createElement('p');
        nextLine.append(document.createElement('br'));
        block.after(nextLine);

        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(nextLine);
        range.collapse(true);
        selection?.removeAllRanges();
        selection?.addRange(range);
        scheduleSave();
        showToast('已识别网页链接，按住 Command 单击可打开');
        return true;
      }

      function insertHtmlAtCaret(html) {
        const selection = window.getSelection();
        if (!selection || !selection.rangeCount || !contentEditor.contains(selection.anchorNode)) {
          contentEditor.focus();
          const fallbackRange = document.createRange();
          fallbackRange.selectNodeContents(contentEditor);
          fallbackRange.collapse(false);
          selection?.removeAllRanges();
          selection?.addRange(fallbackRange);
        }

        const activeSelection = window.getSelection();
        if (!activeSelection || !activeSelection.rangeCount) return;
        const range = activeSelection.getRangeAt(0);
        const fragment = range.createContextualFragment(html);
        const lastNode = fragment.lastChild;
        range.deleteContents();
        range.insertNode(fragment);
        if (lastNode) {
          range.setStartAfter(lastNode);
          range.collapse(true);
          activeSelection.removeAllRanges();
          activeSelection.addRange(range);
        }
      }

      function insertStandaloneLinkAtCaret(url, label) {
        const linkLine = document.createElement('p');
        linkLine.append(createStandaloneLink(url, label));
        const nextLine = document.createElement('p');
        nextLine.append(document.createElement('br'));

        const selection = window.getSelection();
        const node = selection?.anchorNode;
        const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        let rootBlock = element;
        while (rootBlock && rootBlock.parentElement !== contentEditor) {
          rootBlock = rootBlock.parentElement;
        }

        const rootIsEmpty = rootBlock
          && rootBlock !== contentEditor
          && !rootBlock.textContent.trim()
          && !rootBlock.querySelector('img, table, pre, blockquote');

        if (rootIsEmpty) rootBlock.replaceWith(linkLine, nextLine);
        else if (rootBlock && rootBlock !== contentEditor) rootBlock.after(linkLine, nextLine);
        else contentEditor.append(linkLine, nextLine);

        const range = document.createRange();
        range.selectNodeContents(nextLine);
        range.collapse(true);
        selection?.removeAllRanges();
        selection?.addRange(range);
      }

      function getCurrentCredentialValue() {
        const selection = window.getSelection();
        const node = selection?.anchorNode;
        const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        const value = element?.closest('table[data-notebook-block="credential"] td[data-credential-value]');
        return value && contentEditor.contains(value) ? value : null;
      }

      function serializeEditorContent() {
        const clone = contentEditor.cloneNode(true);
        clone.querySelectorAll('[contenteditable], [role], [tabindex], [aria-label], [data-editing], [data-copy-state], [data-active-column]').forEach((element) => {
          ['contenteditable', 'role', 'tabindex', 'aria-label', 'data-editing', 'data-copy-state', 'data-active-column'].forEach((attribute) => {
            element.removeAttribute(attribute);
          });
        });
        clone.querySelectorAll('table[data-notebook-block="credential"][style]').forEach((table) => table.removeAttribute('style'));
        return clone.innerHTML;
      }

      function configureCredentialTable(table, editing = table.dataset.editing === 'true') {
        table.dataset.editing = editing ? 'true' : 'false';
        table.setAttribute('contenteditable', 'false');
        const projectTitle = table.querySelector('[data-credential-project]');
        const fallbackFieldRow = table.tHead?.rows?.[1];
        if (!table.querySelector('th[data-credential-field]')) {
          Array.from(fallbackFieldRow?.cells || []).forEach((field) => field.setAttribute('data-credential-field', ''));
        }
        const fields = Array.from(table.querySelectorAll('th[data-credential-field]'));
        const fieldCount = Math.max(1, fields.length);
        projectTitle?.setAttribute('colspan', String(fieldCount));
        projectTitle?.setAttribute('contenteditable', editing ? 'true' : 'false');
        table.style.setProperty('--credential-columns', String(fieldCount));
        const projectName = projectTitle?.textContent?.trim() || '当前项目';
        const rows = Array.from(table.tBodies[0]?.rows || []);
        fields.forEach((field, fieldIndex) => {
          field.setAttribute('contenteditable', editing ? 'true' : 'false');
          field.removeAttribute('data-active-column');
          if (editing) {
            field.removeAttribute('role');
            field.removeAttribute('tabindex');
            field.setAttribute('aria-label', `编辑第 ${fieldIndex + 1} 个字段名称`);
          } else {
            field.removeAttribute('aria-label');
          }
        });
        table.querySelectorAll('td[data-credential-value]').forEach((cell) => {
          cell.removeAttribute('data-copy-state');
          cell.removeAttribute('data-active-column');
          cell.setAttribute('contenteditable', editing ? 'true' : 'false');
          if (editing) {
            cell.removeAttribute('role');
            cell.removeAttribute('tabindex');
            cell.removeAttribute('aria-label');
          } else {
            const rowNumber = Math.max(1, rows.indexOf(cell.closest('tr')) + 1);
            const columnNumber = Math.max(0, Array.from(cell.parentElement?.cells || []).indexOf(cell));
            const kind = fields[columnNumber]?.textContent?.trim() || `字段 ${columnNumber + 1}`;
            cell.setAttribute('role', 'button');
            cell.setAttribute('tabindex', '0');
            cell.setAttribute('aria-label', `复制${projectName}第 ${rowNumber} 条记录的${kind}`);
          }
        });
        activeCredentialColumn = Math.max(0, Math.min(activeCredentialColumn, fieldCount - 1));
        if (editing) markActiveCredentialColumn(table, activeCredentialColumn);
      }

      function markActiveCredentialColumn(table, columnIndex) {
        const fields = Array.from(table.querySelectorAll('th[data-credential-field]'));
        if (!fields.length) return;
        activeCredentialColumn = Math.max(0, Math.min(columnIndex, fields.length - 1));
        table.querySelectorAll('[data-active-column]').forEach((element) => element.removeAttribute('data-active-column'));
        fields[activeCredentialColumn]?.setAttribute('data-active-column', '');
        Array.from(table.tBodies[0]?.rows || []).forEach((row) => {
          row.cells[activeCredentialColumn]?.setAttribute('data-active-column', '');
        });
      }

      function hydrateCredentialBlocks() {
        contentEditor.querySelectorAll('table[data-notebook-block="credential"]').forEach((table) => {
          configureCredentialTable(table, table.dataset.editing === 'true');
        });
      }

      function setCredentialEditing(table, editing) {
        if (!table || !contentEditor.contains(table)) return;
        configureCredentialTable(table, editing);
        activeCredentialTable = table;
        credentialEditButton.textContent = editing ? '完成' : '编辑';
        credentialEditButton.setAttribute('aria-label', editing ? '完成当前凭据信息编辑' : '编辑当前凭据信息');
        showCredentialEditButton(table);

        if (editing) {
          const firstValue = table.querySelector('td[data-credential-value]');
          if (firstValue) {
            activeCredentialRow = firstValue.closest('tr');
            activeCredentialColumn = 0;
            markActiveCredentialColumn(table, 0);
            const selection = window.getSelection();
            const range = document.createRange();
            range.selectNodeContents(firstValue);
            selection?.removeAllRanges();
            selection?.addRange(range);
            firstValue.focus();
          }
        } else {
          activeCredentialRow = null;
          scheduleSave();
          contentEditor.focus();
        }
      }

      function insertCredentialBlock() {
        const template = document.createElement('template');
        template.innerHTML = '<table data-notebook-block="credential"><thead><tr><th data-credential-project colspan="2">点击填写项目名称</th></tr><tr><th data-credential-field>账号</th><th data-credential-field>密码</th></tr></thead><tbody><tr><td data-credential-value>点击填写账号</td><td data-credential-value>点击填写密码</td></tr></tbody></table><p><br></p>';
        const fragment = template.content;
        const table = fragment.querySelector('table[data-notebook-block="credential"]');
        const firstValue = fragment.querySelector('[data-credential-project]');
        const selection = window.getSelection();
        const node = selection?.anchorNode;
        const element = node?.nodeType === Node.ELEMENT_NODE ? node : node?.parentElement;
        let rootBlock = element;

        while (rootBlock && rootBlock.parentElement !== contentEditor) {
          rootBlock = rootBlock.parentElement;
        }

        if (rootBlock && rootBlock !== contentEditor) {
          rootBlock.after(fragment);
        } else {
          contentEditor.append(fragment);
        }

        if (table) {
          configureCredentialTable(table, true);
          activeCredentialTable = table;
          showCredentialEditButton(table);
        }

        if (firstValue) {
          const range = document.createRange();
          range.selectNodeContents(firstValue);
          selection?.removeAllRanges();
          selection?.addRange(range);
          firstValue.scrollIntoView({ block: 'nearest' });
        }

        scheduleSave();
        showToast('已插入凭据信息表，可自由调整字段与记录');
      }

      function addCredentialRow(table) {
        const tbody = table?.tBodies?.[0];
        if (!tbody || table.dataset.editing !== 'true') return;
        const row = tbody.insertRow();
        const fields = Array.from(table.querySelectorAll('th[data-credential-field]'));
        fields.forEach((field, fieldIndex) => {
          const cell = row.insertCell();
          const fieldName = field.textContent.trim() || `字段 ${fieldIndex + 1}`;
          cell.setAttribute('data-credential-value', '');
          cell.textContent = `点击填写${fieldName}`;
        });
        activeCredentialRow = row;
        configureCredentialTable(table, true);
        showCredentialEditButton(table);

        const selection = window.getSelection();
        const range = document.createRange();
        const firstCell = row.cells[0];
        range.selectNodeContents(firstCell);
        selection?.removeAllRanges();
        selection?.addRange(range);
        firstCell.focus();
        firstCell.scrollIntoView({ block: 'nearest' });
        window.requestAnimationFrame(() => {
          if (table.dataset.editing === 'true') showCredentialEditButton(table);
        });
        scheduleSave();
        showToast('已添加一条记录');
      }

      function removeCurrentCredentialRow(table) {
        const tbody = table?.tBodies?.[0];
        if (!tbody || table.dataset.editing !== 'true') return;
        const rows = Array.from(tbody.rows);
        if (rows.length <= 1) {
          showToast('凭据信息表至少保留一条记录');
          return;
        }

        const targetRow = activeCredentialRow && table.contains(activeCredentialRow)
          ? activeCredentialRow
          : rows[rows.length - 1];
        const targetIndex = rows.indexOf(targetRow);
        const nextRow = rows[targetIndex + 1] || rows[targetIndex - 1];
        targetRow.remove();
        activeCredentialRow = nextRow || null;
        configureCredentialTable(table, true);
        showCredentialEditButton(table);

        const nextCell = activeCredentialRow?.querySelector('td[data-credential-value]');
        if (nextCell) {
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(nextCell);
          selection?.removeAllRanges();
          selection?.addRange(range);
          nextCell.focus();
        }
        scheduleSave();
        showToast('已删除当前记录');
      }

      function addCredentialField(table) {
        if (!table || table.dataset.editing !== 'true') return;
        const fieldRow = table.tHead?.rows?.[1];
        const tbody = table.tBodies?.[0];
        if (!fieldRow || !tbody) return;
        const fieldNumber = fieldRow.cells.length + 1;
        const field = document.createElement('th');
        field.setAttribute('data-credential-field', '');
        field.textContent = `字段 ${fieldNumber}`;
        fieldRow.append(field);
        Array.from(tbody.rows).forEach((row) => {
          const cell = row.insertCell();
          cell.setAttribute('data-credential-value', '');
          cell.textContent = '点击填写内容';
        });
        activeCredentialColumn = fieldNumber - 1;
        configureCredentialTable(table, true);
        showCredentialEditButton(table);

        const selection = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(field);
        selection?.removeAllRanges();
        selection?.addRange(range);
        field.focus();
        field.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        window.requestAnimationFrame(() => {
          if (table.dataset.editing === 'true') showCredentialEditButton(table);
        });
        scheduleSave();
        showToast('已添加字段，可直接修改字段名称');
      }

      function removeCurrentCredentialField(table) {
        if (!table || table.dataset.editing !== 'true') return;
        const fields = Array.from(table.querySelectorAll('th[data-credential-field]'));
        if (fields.length <= 1) {
          showToast('凭据信息表至少保留一个字段');
          return;
        }
        const columnIndex = Math.max(0, Math.min(activeCredentialColumn, fields.length - 1));
        fields[columnIndex].remove();
        Array.from(table.tBodies?.[0]?.rows || []).forEach((row) => row.cells[columnIndex]?.remove());
        activeCredentialColumn = Math.max(0, columnIndex - 1);
        configureCredentialTable(table, true);
        showCredentialEditButton(table);
        const nextField = table.querySelectorAll('th[data-credential-field]')[activeCredentialColumn];
        nextField?.focus();
        scheduleSave();
        showToast('已删除当前字段');
      }

      async function copyCredentialValue(cell) {
        const text = cell?.innerText?.trim();
        if (!text) {
          showToast('当前字段没有可复制内容');
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          cell.dataset.copyState = 'done';
          window.setTimeout(() => cell.removeAttribute('data-copy-state'), 1200);
          showToast('已复制此项');
        } catch {
          showToast('浏览器未允许复制，正式软件中可正常使用');
        }
      }

      function hideCredentialEditButton() {
        credentialActions.classList.remove('visible', 'editing');
        activeCredentialTable = null;
      }

      function showCredentialEditButton(table) {
        const tableRect = table.getBoundingClientRect();
        const editorRect = contentEditor.getBoundingClientRect();
        const top = Math.max(editorRect.top + 4, Math.min(editorRect.bottom - 30, tableRect.top - 13));
        activeCredentialTable = table;
        credentialEditButton.textContent = table.dataset.editing === 'true' ? '完成' : '编辑';
        credentialActions.classList.add('visible');
        credentialActions.classList.toggle('editing', table.dataset.editing === 'true');
        const actionWidth = credentialActions.getBoundingClientRect().width || 56;
        const left = Math.max(editorRect.left + 8, Math.min(editorRect.right - actionWidth - 8, tableRect.right - actionWidth));
        credentialActions.style.left = `${left}px`;
        credentialActions.style.top = `${top}px`;
      }

      function filteredNotes() {
        const query = state.query.trim().toLowerCase();
        const result = notes.filter((note) => {
          if (state.filter === 'pinned' && !note.pinned) return false;
          if (state.filter === 'media' && !note.hasMedia) return false;
          if (!query) return true;
          const target = [note.title, note.preview, textFromHtml(note.content)].join(' ').toLowerCase();
          return target.includes(query);
        });

        if (state.sort === 'manual') return result;
        if (state.sort === 'created') return [...result].sort((a, b) => b.createdOrder - a.createdOrder);
        return [...result].sort((a, b) => {
          if (a.pinned !== b.pinned) return Number(b.pinned) - Number(a.pinned);
          return b.createdOrder - a.createdOrder;
        });
      }

      function renderList() {
        const visible = filteredNotes();
        $('visibleCount').textContent = `${visible.length} 项`;
        $('headerNoteCount').textContent = notes.length;

        if (!visible.length) {
          noteList.innerHTML = '<div class="list-empty">没有找到匹配笔记<br>可以清空搜索或切换筛选条件</div>';
          return;
        }

        noteList.innerHTML = visible.map((note) => `
          <button class="note-item${note.id === state.currentId ? ' active' : ''}" type="button" data-note-id="${note.id}">
            <span class="note-title-row">
              <span class="note-title">${note.title || '无标题笔记'}</span>
              ${note.pinned ? '<span class="pin-label">PIN</span>' : ''}
            </span>
            <span class="note-preview">${note.preview || '暂无正文'}</span>
            <span class="note-meta-row">
              <span>${note.updated}</span>
            </span>
          </button>
        `).join('');

        noteList.querySelectorAll('[data-note-id]').forEach((button) => {
          button.addEventListener('click', () => selectNote(button.dataset.noteId));
        });
      }

      function renderEditor(note) {
        hideCredentialEditButton();
        titleInput.value = note.title;
        contentEditor.innerHTML = note.content;
        linkifyStandaloneUrlBlocks();
        hydrateCredentialBlocks();
        $('contextTitle').textContent = note.title || '无标题笔记';
        $('contextMeta').textContent = `${note.updated}更新 · 本地 SQLite`;
        $('pinButton').textContent = note.pinned ? '已置顶' : '置顶';
        $('pinButton').classList.toggle('active', note.pinned);
        $('updatedTime').textContent = `${note.updated}更新`;
        updateWordCount();
        setSaveState('saved');
      }

      function selectNote(id) {
        persistDraft();
        state.currentId = id;
        renderList();
        renderEditor(currentNote());
      }

      function setSaveState(nextState) {
        const labels = {
          saved: `已保存 · ${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false })}`,
          dirty: '有未保存修改',
          saving: '正在保存',
          error: '保存失败'
        };
        saveState.dataset.state = nextState;
        saveStateText.textContent = labels[nextState];
      }

      function persistDraft() {
        const note = currentNote();
        if (!note) return;
        note.title = titleInput.value.trim() || '无标题笔记';
        note.content = serializeEditorContent();
        const plainText = contentEditor.innerText.trim();
        note.preview = plainText.slice(0, 72) || '暂无正文';
        $('contextTitle').textContent = note.title;
      }

      function scheduleSave() {
        persistDraft();
        setSaveState('dirty');
        renderList();
        updateWordCount();
        window.clearTimeout(state.saveTimer);
        state.saveTimer = window.setTimeout(() => {
          if ($('prototypeState').value === 'offline' || $('prototypeState').value === 'save-error') {
            setSaveState('error');
            return;
          }
          setSaveState('saving');
          state.saveTimer = window.setTimeout(() => {
            currentNote().updated = '刚刚';
            setSaveState('saved');
            $('updatedTime').textContent = '刚刚更新';
            renderList();
          }, 520);
        }, 800);
      }

      function updateWordCount() {
        const count = contentEditor.innerText.replace(/\s/g, '').length;
        $('wordCount').textContent = `${count} 字`;
      }

      function setTheme(theme) {
        body.dataset.theme = theme;
        document.querySelectorAll('[data-theme-value]').forEach((button) => {
          button.classList.toggle('active', button.dataset.themeValue === theme);
        });
        $('sidebarThemeLabel').textContent = theme === 'dark' ? '切换亮色' : '切换暗色';
      }

      function setPrototypeState(value) {
        const alert = $('editorAlert');
        const alertText = $('editorAlertText');
        if (value === 'normal') {
          alert.classList.remove('visible');
          setSaveState('saved');
          return;
        }
        alert.classList.add('visible');
        if (value === 'offline') {
          alertText.textContent = '无法连接本地服务，当前内容保留在本次会话中，恢复连接后再保存。';
        } else {
          alertText.textContent = '当前笔记保存失败，内容仍保留在编辑器中，可以重试。';
        }
        setSaveState('error');
      }

      $('searchInput').addEventListener('input', (event) => {
        state.query = event.target.value;
        renderList();
      });

      document.querySelectorAll('[data-filter]').forEach((button) => {
        button.addEventListener('click', () => {
          state.filter = button.dataset.filter;
          document.querySelectorAll('[data-filter]').forEach((item) => item.classList.toggle('active', item === button));
          renderList();
        });
      });

      $('sortSelect').addEventListener('change', (event) => {
        state.sort = event.target.value;
        renderList();
        if (state.sort === 'manual') showToast('正式版本将在手动排序模式中显示拖拽入口');
      });

      titleInput.addEventListener('input', scheduleSave);
      contentEditor.addEventListener('input', scheduleSave);
      contentEditor.addEventListener('paste', (event) => {
        const clipboardData = event.clipboardData;
        if (!clipboardData) return;

        const imageItem = Array.from(clipboardData.items || []).find((item) => item.kind === 'file' && item.type.startsWith('image/'));
        if (imageItem) {
          event.preventDefault();
          showToast('图片将使用本地上传流程，当前原型不写入文件');
          return;
        }

        const pastedHtml = clipboardData.getData('text/html');
        const pastedText = clipboardData.getData('text/plain');
        if (!pastedHtml && !pastedText) return;

        event.preventDefault();
        const standaloneUrl = !pastedHtml ? safeStandaloneUrl(pastedText) : null;
        if (standaloneUrl) {
          insertStandaloneLinkAtCaret(standaloneUrl, pastedText.trim());
        } else {
          const normalized = pastedHtml ? normalizeHtml(pastedHtml) : plainTextToHtml(pastedText);
          insertHtmlAtCaret(normalized || plainTextToHtml(pastedText));
        }
        const convertedLinks = standaloneUrl ? 1 : linkifyStandaloneUrlBlocks();
        hydrateCredentialBlocks();
        scheduleSave();
        showToast(convertedLinks
          ? '已识别网页链接，按住 Command 单击可打开'
          : '已按笔记样式粘贴');
      });

      contentEditor.addEventListener('pointermove', (event) => {
        const target = event.target instanceof Element ? event.target : null;
        const table = target?.closest('table[data-notebook-block="credential"]');
        if (!table || !contentEditor.contains(table)) {
          hideCredentialEditButton();
          return;
        }
        showCredentialEditButton(table);
      });

      contentEditor.addEventListener('pointerleave', (event) => {
        if (!(event.relatedTarget instanceof Node && credentialActions.contains(event.relatedTarget))) {
          hideCredentialEditButton();
        }
      });

      contentEditor.addEventListener('click', (event) => {
        const target = event.target instanceof Element ? event.target : null;
        const link = target?.closest('a[href]');
        if (link && contentEditor.contains(link)) {
          event.preventDefault();
          if (event.metaKey) {
            const url = link.getAttribute('href') || '';
            if (/^https?:\/\//i.test(url)) {
              const opened = window.open(url, '_blank', 'noopener,noreferrer');
              if (opened) opened.opener = null;
            }
          }
          return;
        }

        const cell = target?.closest('table[data-notebook-block="credential"] td[data-credential-value]');
        const table = cell?.closest('table[data-notebook-block="credential"]');
        if (cell && table?.dataset.editing !== 'true') {
          event.preventDefault();
          copyCredentialValue(cell);
        } else if (cell && table?.dataset.editing === 'true') {
          activeCredentialRow = cell.closest('tr');
          activeCredentialColumn = Array.from(cell.parentElement?.cells || []).indexOf(cell);
          markActiveCredentialColumn(table, activeCredentialColumn);
          showCredentialEditButton(table);
        }
      });

      contentEditor.addEventListener('focusin', (event) => {
        const target = event.target instanceof Element ? event.target : null;
        const field = target?.closest('table[data-notebook-block="credential"][data-editing="true"] th[data-credential-field]');
        if (field) {
          const table = field.closest('table[data-notebook-block="credential"]');
          activeCredentialColumn = Array.from(field.parentElement?.cells || []).indexOf(field);
          markActiveCredentialColumn(table, activeCredentialColumn);
          showCredentialEditButton(table);
          return;
        }
        const cell = target?.closest('table[data-notebook-block="credential"][data-editing="true"] td[data-credential-value]');
        if (!cell) return;
        activeCredentialRow = cell.closest('tr');
        activeCredentialColumn = Array.from(cell.parentElement?.cells || []).indexOf(cell);
        const table = cell.closest('table[data-notebook-block="credential"]');
        markActiveCredentialColumn(table, activeCredentialColumn);
        showCredentialEditButton(table);
      });

      contentEditor.addEventListener('keydown', (event) => {
        const target = event.target instanceof Element ? event.target : null;
        const cell = target?.closest('table[data-notebook-block="credential"] td[data-credential-value]');
        const table = cell?.closest('table[data-notebook-block="credential"]');
        if (cell && table?.dataset.editing !== 'true' && (event.key === 'Enter' || event.key === ' ')) {
          event.preventDefault();
          copyCredentialValue(cell);
          return;
        }
        if (event.key === 'Enter' && !event.shiftKey && !event.metaKey && !event.ctrlKey && !event.altKey) {
          if (convertCurrentUrlLineOnEnter()) event.preventDefault();
        }
      });

      contentEditor.addEventListener('scroll', hideCredentialEditButton);
      const handleCredentialActionLeave = (event) => {
        if (event.relatedTarget instanceof Node && credentialActions.contains(event.relatedTarget)) return;
        if (event.relatedTarget instanceof Node && contentEditor.contains(event.relatedTarget)) return;
        hideCredentialEditButton();
      };
      credentialActions.addEventListener('pointerleave', handleCredentialActionLeave);
      credentialEditButton.addEventListener('click', () => {
        if (!activeCredentialTable) return;
        setCredentialEditing(activeCredentialTable, activeCredentialTable.dataset.editing !== 'true');
      });
      credentialAddRowButton.addEventListener('click', () => {
        if (!activeCredentialTable) return;
        addCredentialRow(activeCredentialTable);
      });
      credentialRemoveRowButton.addEventListener('click', () => {
        if (!activeCredentialTable) return;
        removeCurrentCredentialRow(activeCredentialTable);
      });
      credentialAddFieldButton.addEventListener('click', () => {
        if (!activeCredentialTable) return;
        addCredentialField(activeCredentialTable);
      });
      credentialRemoveFieldButton.addEventListener('click', () => {
        if (!activeCredentialTable) return;
        removeCurrentCredentialField(activeCredentialTable);
      });

      $('newNoteButton').addEventListener('click', () => {
        persistDraft();
        const note = {
          id: `new-${Date.now()}`,
          title: '',
          preview: '新笔记',
          updated: '刚刚',
          createdOrder: notes.length + 1,
          pinned: false,
          hasMedia: false,
          content: ''
        };
        notes.unshift(note);
        state.currentId = note.id;
        state.query = '';
        $('searchInput').value = '';
        state.filter = 'all';
        document.querySelectorAll('[data-filter]').forEach((item) => item.classList.toggle('active', item.dataset.filter === 'all'));
        renderList();
        renderEditor(note);
        titleInput.focus();
        setSaveState('dirty');
        showToast('已创建空白笔记');
      });

      $('pinButton').addEventListener('click', () => {
        const note = currentNote();
        note.pinned = !note.pinned;
        $('pinButton').textContent = note.pinned ? '已置顶' : '置顶';
        $('pinButton').classList.toggle('active', note.pinned);
        renderList();
        scheduleSave();
      });

      $('collapseListButton').addEventListener('click', () => {
        body.classList.toggle('list-collapsed');
        $('collapseListButton').textContent = body.classList.contains('list-collapsed') ? '展开列表' : '收起列表';
      });

      $('moreButton').addEventListener('click', (event) => {
        event.stopPropagation();
        moreMenu.classList.toggle('open');
        $('moreButton').setAttribute('aria-expanded', String(moreMenu.classList.contains('open')));
      });

      document.addEventListener('click', (event) => {
        if (!moreMenu.contains(event.target) && event.target !== $('moreButton')) {
          moreMenu.classList.remove('open');
          $('moreButton').setAttribute('aria-expanded', 'false');
        }
      });

      $('alignButton').addEventListener('click', () => {
        moreMenu.classList.remove('open');
        showToast('已保留文本对齐快捷键：⌘⇧L');
        scheduleSave();
      });

      $('normalizeButton').addEventListener('click', () => {
        moreMenu.classList.remove('open');
        contentEditor.innerHTML = normalizeHtml(contentEditor.innerHTML);
        linkifyStandaloneUrlBlocks();
        hydrateCredentialBlocks();
        scheduleSave();
        showToast('已统一整篇格式');
      });

      $('insertCredentialButton').addEventListener('click', () => {
        moreMenu.classList.remove('open');
        insertCredentialBlock();
      });

      $('copyButton').addEventListener('click', async () => {
        moreMenu.classList.remove('open');
        try {
          await navigator.clipboard.writeText(contentEditor.innerText);
          showToast('正文已复制');
        } catch {
          showToast('浏览器未允许复制，正式软件中可正常使用');
        }
      });

      $('duplicateButton').addEventListener('click', () => {
        moreMenu.classList.remove('open');
        const source = currentNote();
        const copy = { ...source, id: `copy-${Date.now()}`, title: `${source.title} · 副本`, pinned: false, updated: '刚刚', createdOrder: notes.length + 1 };
        notes.unshift(copy);
        state.currentId = copy.id;
        renderList();
        renderEditor(copy);
        showToast('已创建笔记副本');
      });

      $('deleteButton').addEventListener('click', () => {
        moreMenu.classList.remove('open');
        showToast('正式版本将使用公共确认弹窗，当前原型不删除数据');
      });

      $('prototypeState').addEventListener('change', (event) => setPrototypeState(event.target.value));
      $('retryButton').addEventListener('click', () => {
        $('prototypeState').value = 'normal';
        setPrototypeState('normal');
        showToast('本地服务已恢复连接');
      });

      document.querySelectorAll('[data-theme-value]').forEach((button) => {
        button.addEventListener('click', () => setTheme(button.dataset.themeValue));
      });

      $('sidebarThemeButton').addEventListener('click', () => {
        setTheme(body.dataset.theme === 'dark' ? 'light' : 'dark');
      });

      document.querySelectorAll('a[href="#"]').forEach((link) => {
        link.addEventListener('click', (event) => event.preventDefault());
      });

      document.addEventListener('keydown', (event) => {
        if ((event.metaKey || event.ctrlKey) && !event.shiftKey && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          $('searchInput').focus();
        }
        if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === 'l') {
          event.preventDefault();
          showToast('已执行文本对齐快捷键（原型演示）');
          scheduleSave();
        }
        if ((event.metaKey || event.ctrlKey) && event.shiftKey && event.key.toLowerCase() === 'c') {
          event.preventDefault();
          const block = getCurrentCredentialValue();
          if (block) copyCredentialValue(block);
          else showToast('先将光标放在账号信息的值中');
        }
      });

      setTheme('dark');
      renderList();
      renderEditor(currentNote());
    })();
  </script>
</body>
</html>
