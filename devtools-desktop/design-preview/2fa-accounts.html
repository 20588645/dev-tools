<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevTools 2FA 账号列表预览</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07121d;
      --sidebar: #0b1925;
      --surface: rgba(15, 31, 47, .86);
      --surface-2: rgba(9, 22, 34, .78);
      --surface-3: rgba(22, 42, 61, .7);
      --line: rgba(157, 180, 204, .15);
      --line-soft: rgba(157, 180, 204, .09);
      --text: #f2f6fb;
      --muted: #91a2b5;
      --quiet: #62758a;
      --primary: #8b6dff;
      --primary-2: #4fc3f7;
      --success: #39d98a;
      --warning: #e9b34f;
      --danger: #ff6b6b;
      --code: #7ee787;
      --shadow: rgba(0, 0, 0, .18);
      --radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", sans-serif;
    }

    body[data-theme="light"] {
      color-scheme: light;
      --bg: #eef4f7;
      --sidebar: #f8fbfd;
      --surface: rgba(255, 255, 255, .9);
      --surface-2: rgba(244, 248, 251, .92);
      --surface-3: rgba(235, 242, 247, .92);
      --line: rgba(42, 63, 83, .14);
      --line-soft: rgba(42, 63, 83, .08);
      --text: #172334;
      --muted: #5f7185;
      --quiet: #8a98a8;
      --primary: #6c58dc;
      --primary-2: #168aa4;
      --success: #16a66a;
      --warning: #c88a19;
      --danger: #dc4c4c;
      --code: #4f46e5;
      --shadow: rgba(24, 47, 68, .1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 1180px;
      color: var(--text);
      background:
        radial-gradient(circle at 77% 2%, color-mix(in srgb, var(--primary-2) 12%, transparent), transparent 28%),
        linear-gradient(145deg, color-mix(in srgb, var(--bg) 94%, var(--primary) 6%), var(--bg));
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      transition: background .2s ease, color .2s ease;
    }

    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    h1, h2, h3, p { margin: 0; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 178px minmax(0, 1fr);
    }

    .sidebar {
      min-height: 100vh;
      padding: 20px 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: color-mix(in srgb, var(--sidebar) 96%, transparent);
      border-right: 1px solid var(--line-soft);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 760;
    }

    .brand-mark {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      color: var(--primary);
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--surface-2);
    }

    .nav { display: grid; gap: 4px; }
    .nav-item {
      height: 38px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      color: var(--muted);
      border: 0;
      border-radius: 8px;
      background: transparent;
      text-align: left;
    }
    .nav-item.active {
      color: var(--text);
      background: color-mix(in srgb, var(--primary) 18%, transparent);
      box-shadow: inset 2px 0 var(--primary);
    }
    .nav-icon { width: 17px; text-align: center; color: currentColor; opacity: .92; }
    .sidebar-footer {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line-soft);
      display: grid;
      gap: 4px;
    }
    .sidebar-status {
      margin: 10px 10px 0;
      color: var(--quiet);
      font-size: 11px;
    }
    .sidebar-status::before {
      content: "";
      width: 7px;
      height: 7px;
      display: inline-block;
      margin-right: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--success) 12%, transparent);
    }

    .main {
      width: min(1420px, 100%);
      margin: 0 auto;
      padding: 30px 34px 28px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 20px;
      margin-bottom: 20px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--primary);
      font-size: 10px;
      font-weight: 840;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--primary-2);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary-2) 14%, transparent);
    }
    .title-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-top: 9px;
    }
    h1 {
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -.04em;
    }
    .title-pill {
      padding: 4px 8px;
      color: var(--success);
      background: color-mix(in srgb, var(--success) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--success) 18%, transparent);
      border-radius: 999px;
      font-size: 10px;
      font-weight: 700;
    }
    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--text);
      background: var(--surface-2);
    }
    .btn:hover { border-color: color-mix(in srgb, var(--primary) 50%, var(--line)); }
    .btn.primary {
      color: white;
      background: linear-gradient(135deg, var(--primary), #5477ff);
      border-color: transparent;
      box-shadow: 0 12px 28px color-mix(in srgb, var(--primary) 22%, transparent);
    }
    .icon-btn {
      width: 36px;
      height: 36px;
      padding: 0;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 14px;
      align-items: start;
    }

    .left-stack { display: grid; gap: 14px; min-width: 0; }

    .searchbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 42px var(--shadow);
    }

    .search {
      position: relative;
      min-width: 0;
    }
    .search input {
      width: 100%;
      height: 38px;
      padding: 0 42px 0 38px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
    }
    .search input:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--line)); }
    .search-symbol {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--quiet);
    }
    .kbd {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--quiet);
      font-size: 10px;
      padding: 2px 5px;
      border: 1px solid var(--line);
      border-radius: 5px;
    }

    .fav-strip {
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 42px var(--shadow);
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }
    .section-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-weight: 760;
      font-size: 15px;
    }
    .section-title small {
      color: var(--quiet);
      font-size: 11px;
      font-weight: 500;
    }
    .section-meta {
      color: var(--quiet);
      font-size: 11px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }
    .quick-card {
      min-width: 0;
      height: 82px;
      padding: 11px;
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 30px;
      gap: 9px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      text-align: left;
    }
    .quick-card:hover,
    .quick-card.active {
      border-color: color-mix(in srgb, var(--primary) 52%, var(--line));
      background: color-mix(in srgb, var(--primary) 9%, var(--surface-2));
    }

    .logo {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      background: linear-gradient(135deg, #5477ff, var(--primary));
      flex: 0 0 auto;
    }
    .logo.google { background: conic-gradient(#4285f4, #34a853, #fbbc05, #ea4335, #4285f4); }
    .logo.github { background: #111827; }
    .logo.aws { background: linear-gradient(135deg, #232f3e, #ff9900); }
    .logo.ms { background: conic-gradient(#7fba00 0 25%, #00a4ef 0 50%, #ffb900 0 75%, #f25022 0); }
    .logo.gitlab { background: linear-gradient(135deg, #fc6d26, #e24329); }
    .logo.cloudflare { background: linear-gradient(135deg, #f38020, #faae40); }
    .logo.docker { background: linear-gradient(135deg, #0db7ed, #2496ed); }
    .logo.stripe { background: linear-gradient(135deg, #635bff, #7a73ff); }

    .quick-name,
    .account-main strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 720;
    }
    .quick-user,
    .account-main span {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .quick-code {
      margin-top: 7px;
      color: var(--code);
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .08em;
      white-space: nowrap;
    }

    .ring {
      --p: 50%;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--text);
      background:
        radial-gradient(circle closest-side, var(--surface-2) 69%, transparent 72%),
        conic-gradient(var(--primary) var(--p), color-mix(in srgb, var(--quiet) 22%, transparent) 0);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .account-panel {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 42px var(--shadow);
      overflow: hidden;
    }

    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px;
      gap: 14px;
    }
    .filters {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .filter {
      height: 28px;
      padding: 0 9px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 7px;
    }
    .filter.active {
      color: var(--text);
      background: color-mix(in srgb, var(--primary) 14%, transparent);
      border-color: color-mix(in srgb, var(--primary) 28%, var(--line));
    }

    .account-list {
      padding: 2px 10px 12px;
    }

    .group-label {
      padding: 11px 7px 7px;
      color: var(--quiet);
      font-size: 11px;
    }

    .account-row {
      width: 100%;
      min-height: 62px;
      display: grid;
      grid-template-columns: 42px minmax(150px, 1.2fr) 86px 126px 44px 38px 34px;
      align-items: center;
      gap: 10px;
      padding: 8px 9px;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-bottom-color: var(--line-soft);
      border-radius: 9px;
      text-align: left;
    }
    .account-row:hover,
    .account-row.active {
      background: color-mix(in srgb, var(--primary) 9%, transparent);
      border-color: color-mix(in srgb, var(--primary) 32%, transparent);
    }
    .tag {
      justify-self: start;
      padding: 4px 8px;
      border-radius: 999px;
      color: var(--primary);
      background: color-mix(in srgb, var(--primary) 13%, transparent);
      font-size: 11px;
      white-space: nowrap;
    }
    .code {
      color: var(--code);
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 20px;
      font-weight: 850;
      letter-spacing: .08em;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .copy-small,
    .star {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-2);
    }
    .copy-small:hover { color: var(--text); border-color: color-mix(in srgb, var(--primary) 45%, var(--line)); }
    .star.fav { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 25%, var(--line)); }
    .empty {
      padding: 34px 16px;
      color: var(--quiet);
      text-align: center;
      display: none;
    }

    .detail {
      position: sticky;
      top: 22px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 16px 42px var(--shadow);
      overflow: hidden;
    }
    .detail-inner { padding: 20px; }
    .detail-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }
    .detail-id {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 11px;
    }
    .detail-title { min-width: 0; }
    .detail-title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
    }
    .detail-title span {
      color: var(--muted);
      font-size: 12px;
    }
    .detail-code-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .big-code-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      align-items: center;
      gap: 14px;
      margin-top: 8px;
    }
    .big-code {
      color: var(--code);
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 46px;
      font-weight: 850;
      letter-spacing: .09em;
      line-height: 1.05;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .big-ring {
      --p: 50%;
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle closest-side, var(--surface) 68%, transparent 71%),
        conic-gradient(var(--primary) var(--p), color-mix(in srgb, var(--quiet) 20%, transparent) 0);
      font-size: 22px;
      font-weight: 760;
      font-variant-numeric: tabular-nums;
    }
    .copy-primary {
      width: 100%;
      height: 44px;
      margin-top: 18px;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #5274ff);
      border: 0;
      border-radius: 10px;
      font-weight: 760;
    }
    .detail-sub {
      margin-top: 11px;
      color: var(--muted);
      font-size: 11px;
    }
    .detail-grid {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--line-soft);
      display: grid;
      gap: 11px;
    }
    .detail-line {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
    }
    .detail-line span {
      color: var(--muted);
      font-size: 12px;
    }
    .detail-line strong {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }
    .secure-box {
      margin-top: 18px;
      padding: 12px;
      color: var(--success);
      background: color-mix(in srgb, var(--success) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--success) 18%, transparent);
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.55;
    }
    .detail-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }
    .danger-btn {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 9%, transparent);
      border-color: color-mix(in srgb, var(--danger) 20%, var(--line));
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 10;
      min-width: 190px;
      padding: 12px 14px;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 18px 44px var(--shadow);
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity .18s ease, transform .18s ease;
    }
    .toast.show { opacity: 1; transform: none; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, .34);
      backdrop-filter: blur(10px);
    }
    .modal-backdrop.show { display: grid; }
    .modal {
      width: 520px;
      padding: 18px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .28);
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal h2 { font-size: 18px; }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .field input,
    .field textarea {
      min-width: 0;
      padding: 10px;
      color: var(--text);
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
    }
    .field textarea {
      height: 78px;
      resize: vertical;
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 12px;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }
    .muted-note {
      margin-top: 10px;
      color: var(--quiet);
      font-size: 11px;
    }

    @media (max-width: 1220px) {
      body { min-width: 980px; }
      .workspace { grid-template-columns: 1fr; }
      .detail { position: static; }
      .quick-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">⌘</span><span>DevTools</span></div>
      <nav class="nav" aria-label="主导航">
        <button class="nav-item"><span class="nav-icon">⌂</span>应用首页</button>
        <button class="nav-item"><span class="nav-icon">▶</span>本地运行</button>
        <button class="nav-item"><span class="nav-icon">☁</span>部署面板</button>
        <button class="nav-item"><span class="nav-icon">⇄</span>文件传输</button>
        <button class="nav-item"><span class="nav-icon">›_</span>快捷命令</button>
        <button class="nav-item"><span class="nav-icon">☑</span>待办事项</button>
        <button class="nav-item"><span class="nav-icon">▤</span>代码周报</button>
        <button class="nav-item"><span class="nav-icon">◷</span>工时内容</button>
        <button class="nav-item"><span class="nav-icon">▣</span>个人笔记</button>
        <button class="nav-item"><span class="nav-icon">▥</span>用量统计</button>
        <button class="nav-item"><span class="nav-icon">◎</span>纯净检测</button>
        <button class="nav-item active"><span class="nav-icon">◇</span>2FA 验证码</button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item"><span class="nav-icon">i</span>介绍</button>
        <button class="nav-item" onclick="toggleTheme()"><span class="nav-icon" id="sideThemeIcon">☾</span>外观</button>
        <div class="sidebar-status">本地预览</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">LOCAL AUTHENTICATOR</div>
          <div class="title-row">
            <h1>2FA 账号列表</h1>
            <span class="title-pill">本地生成</span>
          </div>
          <p class="subtitle">集中管理常用账号，点击复制当前验证码。正式版本建议使用 Sidecar 加密保存密钥。</p>
        </div>
        <div class="top-actions">
          <button class="btn" onclick="toggleTheme()" id="themeBtn">☾ 暗色主题</button>
          <button class="btn">⇪ 批量导入</button>
          <button class="btn primary" onclick="openModal()">＋ 添加账号</button>
        </div>
      </header>

      <section class="workspace">
        <div class="left-stack">
          <div class="searchbar">
            <div class="search">
              <span class="search-symbol">⌕</span>
              <input id="searchInput" type="text" placeholder="搜索账号、平台或标签" autocomplete="off">
              <span class="kbd">⌘K</span>
            </div>
            <button class="btn" onclick="setFilter('favorite')">☆ 收藏</button>
            <button class="btn icon-btn" onclick="setFilter('all')" title="全部账号">☷</button>
          </div>

          <section class="fav-strip">
            <div class="section-head">
              <div class="section-title">最近使用 / 收藏 <small id="favoriteCount"></small></div>
              <div class="section-meta" id="timeNow">--:--:--</div>
            </div>
            <div class="quick-grid" id="quickGrid"></div>
          </section>

          <section class="account-panel">
            <div class="list-toolbar">
              <div class="section-title">所有账号 <small id="accountCount"></small></div>
              <div class="filters">
                <button class="filter active" data-filter="all" onclick="setFilter('all')">全部</button>
                <button class="filter" data-filter="work" onclick="setFilter('work')">工作</button>
                <button class="filter" data-filter="dev" onclick="setFilter('dev')">开发</button>
                <button class="filter" data-filter="personal" onclick="setFilter('personal')">个人</button>
              </div>
            </div>
            <div class="account-list" id="accountList"></div>
            <div class="empty" id="emptyState">没有找到匹配账号</div>
          </section>
        </div>

        <aside class="detail" aria-label="账号详情">
          <div class="detail-inner" id="detailPanel"></div>
        </aside>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal(event)">
    <form class="modal" onsubmit="addAccount(event)">
      <div class="modal-head">
        <h2>添加 2FA 账号</h2>
        <button class="btn icon-btn" type="button" onclick="hideModal()">×</button>
      </div>
      <div class="form-grid">
        <div class="field">
          <label for="newIssuer">平台</label>
          <input id="newIssuer" required placeholder="GitHub">
        </div>
        <div class="field">
          <label for="newName">账号名</label>
          <input id="newName" required placeholder="alice@example.com">
        </div>
        <div class="field">
          <label for="newTag">标签</label>
          <input id="newTag" placeholder="工作 / 开发 / 个人">
        </div>
        <div class="field">
          <label for="newGroup">分组</label>
          <input id="newGroup" placeholder="dev">
        </div>
        <div class="field full">
          <label for="newSecret">2FA Secret 或 otpauth 链接</label>
          <textarea id="newSecret" required placeholder="JBSWY3DPEHPK3PXP"></textarea>
        </div>
      </div>
      <p class="muted-note">预览页只在当前页面内添加示例数据；正式版应使用本地加密存储。</p>
      <div class="modal-actions">
        <button class="btn" type="button" onclick="hideModal()">取消</button>
        <button class="btn primary" type="submit">添加到列表</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast">已复制验证码</div>

  <script>
    const accounts = [
      { id: 'github', issuer: 'GitHub', name: 'alice', tag: '开发', group: 'dev', secret: 'JBSWY3DPEHPK3PXP', favorite: true, logo: 'github', created: '2025-11-08 10:22' },
      { id: 'google', issuer: 'Google', name: 'alice@example.com', tag: '个人', group: 'personal', secret: 'JBSWY3DPEHPK3PXQ', favorite: true, logo: 'google', created: '2025-12-12 09:15' },
      { id: 'aws', issuer: 'AWS', name: 'cloud-admin', tag: '工作', group: 'work', secret: 'JBSWY3DPEHPK3PXR', favorite: true, logo: 'aws', created: '2026-01-04 18:03' },
      { id: 'microsoft', issuer: 'Microsoft', name: 'alice@contoso.com', tag: '工作', group: 'work', secret: 'JBSWY3DPEHPK3PXS', favorite: true, logo: 'ms', created: '2026-01-28 11:40' },
      { id: 'gitlab', issuer: 'GitLab', name: 'alice.dev', tag: '开发', group: 'dev', secret: 'JBSWY3DPEHPK3PXT', favorite: true, logo: 'gitlab', created: '2026-02-06 14:11' },
      { id: 'cloudflare', issuer: 'Cloudflare', name: 'alice@example.com', tag: '工作', group: 'work', secret: 'JBSWY3DPEHPK3PXU', favorite: false, logo: 'cloudflare', created: '2026-03-13 16:08' },
      { id: 'docker', issuer: 'Docker Hub', name: 'alice', tag: '开发', group: 'dev', secret: 'JBSWY3DPEHPK3PXV', favorite: false, logo: 'docker', created: '2026-04-01 08:20' },
      { id: 'stripe', issuer: 'Stripe', name: 'billing@company.com', tag: '工作', group: 'work', secret: 'JBSWY3DPEHPK3PXW', favorite: false, logo: 'stripe', created: '2026-04-22 19:33' },
      { id: 'onepassword', issuer: '1Password', name: 'alice@1password.com', tag: '个人', group: 'personal', secret: 'JBSWY3DPEHPK3PXX', favorite: false, logo: '', created: '2026-05-18 13:45' }
    ];

    let selectedId = accounts[0].id;
    let filter = 'all';
    let codeCache = {};

    const $ = (id) => document.getElementById(id);

    function normalizeSecret(value) {
      const raw = String(value || '').trim();
      if (raw.startsWith('otpauth://')) {
        try {
          const url = new URL(raw);
          return (url.searchParams.get('secret') || '').replace(/\s+/g, '');
        } catch {
          return raw;
        }
      }
      return raw.replace(/\s+/g, '');
    }

    function base32ToBytes(base32) {
      const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
      const clean = normalizeSecret(base32).toUpperCase().replace(/=+$/g, '');
      let bits = '';
      for (const ch of clean) {
        const val = alphabet.indexOf(ch);
        if (val < 0) continue;
        bits += val.toString(2).padStart(5, '0');
      }
      const bytes = [];
      for (let i = 0; i + 8 <= bits.length; i += 8) {
        bytes.push(parseInt(bits.slice(i, i + 8), 2));
      }
      return new Uint8Array(bytes);
    }

    async function generateTotp(secret, timeStep = 30, digits = 6) {
      const keyBytes = base32ToBytes(secret);
      if (!keyBytes.length) return '------';
      const counter = Math.floor(Date.now() / 1000 / timeStep);
      const buffer = new ArrayBuffer(8);
      const view = new DataView(buffer);
      view.setUint32(4, counter, false);
      const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
      const hmac = new Uint8Array(await crypto.subtle.sign('HMAC', key, buffer));
      const offset = hmac[hmac.length - 1] & 0xf;
      const binary = ((hmac[offset] & 0x7f) << 24) |
        ((hmac[offset + 1] & 0xff) << 16) |
        ((hmac[offset + 2] & 0xff) << 8) |
        (hmac[offset + 3] & 0xff);
      return String(binary % (10 ** digits)).padStart(digits, '0');
    }

    function remainingSeconds() {
      return 30 - (Math.floor(Date.now() / 1000) % 30);
    }

    function formatCode(code) {
      return code && code.length === 6 ? code.slice(0, 3) + ' ' + code.slice(3) : code;
    }

    function accountLogo(account) {
      const text = account.issuer.slice(0, 1).toUpperCase();
      return `<span class="logo ${account.logo || ''}">${text}</span>`;
    }

    function filteredAccounts() {
      const q = $('searchInput').value.trim().toLowerCase();
      return accounts.filter((account) => {
        const matchFilter = filter === 'all' ||
          (filter === 'favorite' && account.favorite) ||
          account.group === filter;
        const haystack = `${account.issuer} ${account.name} ${account.tag} ${account.group}`.toLowerCase();
        return matchFilter && (!q || haystack.includes(q));
      });
    }

    async function updateCodes() {
      const entries = await Promise.all(accounts.map(async (account) => [account.id, await generateTotp(account.secret)]));
      codeCache = Object.fromEntries(entries);
      render();
    }

    function renderQuickCards(list) {
      const favorites = accounts.filter(a => a.favorite).slice(0, 5);
      $('favoriteCount').textContent = `${favorites.length} 个`;
      $('quickGrid').innerHTML = favorites.map(account => `
        <button class="quick-card ${account.id === selectedId ? 'active' : ''}" onclick="selectAccount('${account.id}')">
          ${accountLogo(account)}
          <span>
            <span class="quick-name">${account.issuer}</span>
            <span class="quick-user">${account.name}</span>
            <span class="quick-code">${formatCode(codeCache[account.id] || '------')}</span>
          </span>
          ${ringHtml()}
        </button>
      `).join('');
    }

    function ringHtml(size = 'small') {
      const remain = remainingSeconds();
      const percent = Math.max(0, Math.min(100, remain / 30 * 100));
      const cls = size === 'big' ? 'big-ring' : 'ring';
      return `<span class="${cls}" style="--p:${percent}%">${remain}</span>`;
    }

    function renderAccountList(list) {
      $('accountCount').textContent = `(${list.length})`;
      $('emptyState').style.display = list.length ? 'none' : 'block';
      const recent = list.slice(0, 5);
      const rest = list.slice(5);
      $('accountList').innerHTML = [
        recent.length ? '<div class="group-label">最近</div>' : '',
        ...recent.map(rowHtml),
        rest.length ? '<div class="group-label">全部账号</div>' : '',
        ...rest.map(rowHtml)
      ].join('');
    }

    function rowHtml(account) {
      return `
        <button class="account-row ${account.id === selectedId ? 'active' : ''}" onclick="selectAccount('${account.id}')">
          ${accountLogo(account)}
          <span class="account-main"><strong>${account.issuer}</strong><span>${account.name}</span></span>
          <span class="tag">${account.tag}</span>
          <span class="code">${formatCode(codeCache[account.id] || '------')}</span>
          ${ringHtml()}
          <span class="copy-small" onclick="copyCode(event, '${account.id}')">⧉</span>
          <span class="star ${account.favorite ? 'fav' : ''}" onclick="toggleFavorite(event, '${account.id}')">★</span>
        </button>
      `;
    }

    function renderDetail() {
      const account = accounts.find(a => a.id === selectedId) || accounts[0];
      if (!account) return;
      const masked = normalizeSecret(account.secret).replace(/^(.{4}).*(.{4})$/, '$1••••••••$2');
      $('detailPanel').innerHTML = `
        <div class="detail-top">
          <div class="detail-id">
            ${accountLogo(account)}
            <div class="detail-title">
              <strong>${account.issuer}</strong>
              <span>${account.name}</span>
            </div>
          </div>
          <button class="star ${account.favorite ? 'fav' : ''}" onclick="toggleFavorite(event, '${account.id}')">★</button>
        </div>
        <div class="detail-code-label">当前验证码</div>
        <div class="big-code-row">
          <div class="big-code">${formatCode(codeCache[account.id] || '------')}</div>
          ${ringHtml('big')}
        </div>
        <button class="copy-primary" onclick="copyCode(event, '${account.id}')">复制验证码</button>
        <div class="detail-sub">验证码每 30 秒更新，基于当前本机时间生成。</div>
        <div class="detail-grid">
          <div class="detail-line"><span>账号</span><strong>${account.name}</strong></div>
          <div class="detail-line"><span>密钥</span><strong>${masked}</strong></div>
          <div class="detail-line"><span>算法</span><strong>TOTP / SHA-1</strong></div>
          <div class="detail-line"><span>周期</span><strong>30 秒</strong></div>
          <div class="detail-line"><span>位数</span><strong>6 位</strong></div>
          <div class="detail-line"><span>创建时间</span><strong>${account.created}</strong></div>
          <div class="detail-line"><span>安全状态</span><strong style="color:var(--success)">本地生成</strong></div>
        </div>
        <div class="secure-box">密钥应只在本机加密保存。正式接入时建议使用 sidecar 的 AES 加密能力，不上传云端。</div>
        <div class="detail-actions">
          <button class="btn">编辑账号</button>
          <button class="btn danger-btn">删除</button>
        </div>
      `;
    }

    function render() {
      const list = filteredAccounts();
      $('timeNow').textContent = new Date().toLocaleString('zh-CN', { hour12: false });
      renderQuickCards(list);
      renderAccountList(list);
      renderDetail();
    }

    function selectAccount(id) {
      selectedId = id;
      render();
    }

    async function copyCode(event, id) {
      event.stopPropagation();
      const code = codeCache[id] || await generateTotp(accounts.find(a => a.id === id)?.secret);
      try { await navigator.clipboard.writeText(code); } catch {}
      showToast(`已复制 ${formatCode(code)}`);
    }

    function toggleFavorite(event, id) {
      event.stopPropagation();
      const account = accounts.find(a => a.id === id);
      if (account) account.favorite = !account.favorite;
      render();
    }

    function setFilter(value) {
      filter = value;
      document.querySelectorAll('.filter').forEach(btn => btn.classList.toggle('active', btn.dataset.filter === value));
      render();
    }

    function toggleTheme() {
      const body = document.body;
      const next = body.dataset.theme === 'dark' ? 'light' : 'dark';
      body.dataset.theme = next;
      $('themeBtn').textContent = next === 'dark' ? '☾ 暗色主题' : '☀ 亮色主题';
      $('sideThemeIcon').textContent = next === 'dark' ? '☾' : '☀';
    }

    function showToast(text) {
      const toast = $('toast');
      toast.textContent = text;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function openModal() { $('modalBackdrop').classList.add('show'); }
    function hideModal() { $('modalBackdrop').classList.remove('show'); }
    function closeModal(event) { if (event.target.id === 'modalBackdrop') hideModal(); }

    function addAccount(event) {
      event.preventDefault();
      const issuer = $('newIssuer').value.trim();
      const name = $('newName').value.trim();
      const secret = normalizeSecret($('newSecret').value);
      if (!issuer || !name || !secret) return;
      const id = `${issuer}-${Date.now()}`.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      accounts.unshift({
        id,
        issuer,
        name,
        secret,
        tag: $('newTag').value.trim() || '未分组',
        group: $('newGroup').value.trim() || 'personal',
        favorite: true,
        logo: '',
        created: new Date().toLocaleString('zh-CN', { hour12: false })
      });
      selectedId = id;
      event.target.reset();
      hideModal();
      updateCodes();
      showToast('账号已加入预览列表');
    }

    $('searchInput').addEventListener('input', render);
    window.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
        event.preventDefault();
        $('searchInput').focus();
      }
      if (event.key === 'Escape') hideModal();
    });

    updateCodes();
    setInterval(updateCodes, 1000);
  </script>
</body>
</html>
