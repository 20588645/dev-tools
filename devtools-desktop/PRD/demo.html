<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DevTools 待办看板 - 滴答清单风格美化演示</title>
  <style>
    :root {
      --bg: #090d16;
      --bg-card: rgba(255, 255, 255, 0.02);
      --bg-card-hover: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.07);
      --border-hover: rgba(255, 255, 255, 0.12);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.15);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.08);
      --success: #10b981;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      margin: 0;
      padding: 30px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 4px 0;
      font-weight: 700;
    }

    .desc {
      color: var(--text-muted);
      margin: 0 0 24px 0;
      font-size: 13px;
    }

    /* 双栏核心布局 */
    .todo-container {
      display: flex;
      gap: 20px;
      flex: 1;
      min-height: 550px;
    }

    /* 左侧：任务列表行 */
    .task-list-panel {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(20px);
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 0;
      user-select: none;
    }

    .group-header::before {
      content: '▼';
      font-size: 8px;
      transition: transform 0.2s;
      display: inline-block;
    }

    .group-header.collapsed::before {
      transform: rotate(-90deg);
    }

    .group-header .group-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }
    .dot-todo { background: var(--warning); }
    .dot-doing { background: var(--primary); }
    .dot-done { background: var(--success); }

    .group-header .group-count {
      margin-left: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 10px;
    }

    .group-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .group-items.collapsed {
      display: none;
    }

    /* 任务行 (TickTick 风格) */
    .task-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .task-row:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateX(2px);
    }

    .task-row.active {
      background: rgba(59, 130, 246, 0.04);
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.1);
    }

    .task-checkbox-circle {
      width: 16px;
      height: 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: transparent;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .task-row.completed .task-checkbox-circle {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .task-row.doing .task-checkbox-circle {
      border-color: var(--primary);
    }

    .task-title-text {
      font-size: 13px;
      font-weight: 550;
      color: var(--text-main);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-row.completed .task-title-text {
      text-decoration: line-through;
      color: rgba(255, 255, 255, 0.25);
    }

    /* 优化后的右侧 Meta 信息区 */
    .task-row-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* SVG 环形进度条 */
    .progress-ring-container {
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.03);
      padding: 2px 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .progress-ring__circle {
      transition: stroke-dashoffset 0.35s;
      transform-origin: 50% 50%;
    }

    .progress-text {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-muted);
      font-family: monospace;
    }

    /* 高通透微光时间药丸标签 */
    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s;
    }

    /* 紧急或今天：温暖的琥珀渐变发光 */
    .pill-warning {
      color: #fbbf24;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.08) 0%, rgba(217, 119, 6, 0.08) 100%);
      border-color: rgba(251, 191, 36, 0.2);
      box-shadow: 0 0 6px rgba(251, 191, 36, 0.04);
    }

    /* 已超时：警告红渐变 */
    .pill-danger {
      color: #f87171;
      background: linear-gradient(135deg, rgba(248, 113, 113, 0.08) 0%, rgba(220, 38, 38, 0.08) 100%);
      border-color: rgba(248, 113, 113, 0.2);
    }

    /* 时间戳极简化 */
    .time-ago {
      font-size: 10.5px;
      color: var(--text-muted);
      opacity: 0.55;
      font-weight: 500;
    }

    .task-row:hover .time-ago {
      opacity: 0.85;
      color: var(--text-main);
    }

    /* 小隔线 */
    .meta-divider {
      width: 1px;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* 右侧：详情面板 */
    .task-detail-panel {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .detail-empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--text-muted);
      font-size: 13px;
      gap: 10px;
    }

    .empty-icon {
      font-size: 32px;
      opacity: 0.5;
    }

    /* 详情视图具体组件 */
    .detail-content {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .detail-header-row {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .detail-title-input {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      background: transparent;
      border: none;
      outline: none;
      flex: 1;
      padding: 4px 0;
      border-bottom: 1px dashed transparent;
      transition: border 0.2s;
    }

    .detail-title-input:focus {
      border-bottom-color: var(--primary);
    }

    .detail-status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--warning-bg);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .status-doing {
      background: rgba(59, 130, 246, 0.1);
      color: var(--primary);
      border-color: rgba(59, 130, 246, 0.2);
    }

    .status-done {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.2);
    }

    .detail-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .detail-desc {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 12px;
      color: var(--text-main);
      min-height: 60px;
      outline: none;
      line-height: 1.5;
    }

    /* 子任务区 */
    .detail-checklist {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid var(--border);
    }

    .detail-checklist-check {
      width: 14px;
      height: 14px;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8px;
      color: transparent;
      transition: all 0.2s;
    }

    .detail-checklist-item.completed .detail-checklist-check {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .detail-checklist-text {
      font-size: 12.5px;
      color: var(--text-main);
      background: transparent;
      border: none;
      outline: none;
      flex: 1;
    }

    .detail-checklist-item.completed .detail-checklist-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    /* 状态流转操作按钮 */
    .detail-actions-footer {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }

    .btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--border-hover);
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .btn-primary:hover {
      background: #2563eb;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.3);
    }

    .btn-success {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }
    .btn-success:hover {
      background: #059669;
    }

    .btn-danger {
      color: #ef4444;
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.05);
      border-color: rgba(239, 68, 68, 0.2);
    }
  </style>
</head>
<body>

  <h1>📌 待办看板 (滴答清单 / TickTick 列表行 + 详情页风格)</h1>
  <p class="desc">💡 废弃三栏卡片，中栏为极简待办列表行（按分组聚合），右侧为选中项的详情操作区。彻底根治卡片高度拉伸与突兀空白。</p>

  <div class="todo-container">
    <!-- 中栏：列表行 -->
    <div class="task-list-panel">
      <!-- 待办分组 -->
      <div>
        <div class="group-header" onclick="toggleGroup('todo')">
          <span>待办</span>
          <span class="group-count">2</span>
        </div>
        <div class="group-items" id="group-todo">
          
          <div class="task-row" id="task-1" onclick="selectTask(1)">
            <div class="task-checkbox-circle">✓</div>
            <div class="task-title-text">123</div>
            <div class="task-row-meta">
              <!-- SVG 环形进度圈 -->
              <div class="progress-ring-container" title="子任务进度">
                <svg class="progress-ring" width="14" height="14">
                  <circle stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.8" fill="transparent" r="5" cx="7" cy="7"/>
                  <circle class="progress-ring__circle" id="ring-circle-1" stroke="var(--primary)" stroke-width="1.8" fill="transparent" r="5" cx="7" cy="7"
                          stroke-dasharray="31.4" stroke-dashoffset="31.4"/>
                </svg>
                <span class="progress-text" id="ring-text-1">0/3</span>
              </div>
              <div class="meta-divider"></div>
              <!-- 时间药丸 -->
              <span class="pill-badge pill-warning">
                <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                今天 18:00
              </span>
              <div class="meta-divider"></div>
              <span class="time-ago">25分钟前</span>
            </div>
          </div>

          <div class="task-row" id="task-2" onclick="selectTask(2)">
            <div class="task-checkbox-circle">✓</div>
            <div class="task-title-text">茅台</div>
            <div class="task-row-meta">
              <!-- SVG 环形进度圈 -->
              <div class="progress-ring-container">
                <svg class="progress-ring" width="14" height="14">
                  <circle stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.8" fill="transparent" r="5" cx="7" cy="7"/>
                  <circle class="progress-ring__circle" id="ring-circle-2" stroke="var(--primary)" stroke-width="1.8" fill="transparent" r="5" cx="7" cy="7"
                          stroke-dasharray="31.4" stroke-dashoffset="31.4"/>
                </svg>
                <span class="progress-text" id="ring-text-2">0/1</span>
              </div>
              <div class="meta-divider"></div>
              <span class="time-ago">6天前</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 进行中分组 -->
      <div>
        <div class="group-header" onclick="toggleGroup('doing')">
          <span>进行中</span>
          <span class="group-count">1</span>
        </div>
        <div class="group-items" id="group-doing">
          
          <div class="task-row doing" id="task-3" onclick="selectTask(3)">
            <div class="task-checkbox-circle">▶</div>
            <div class="task-title-text">茅台</div>
            <div class="task-row-meta">
              <!-- SVG 环形进度圈 -->
              <div class="progress-ring-container">
                <svg class="progress-ring" width="14" height="14">
                  <circle stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.8" fill="transparent" r="5" cx="7" cy="7"/>
                  <circle class="progress-ring__circle" id="ring-circle-3" stroke="var(--primary)" stroke-width="1.8" fill="transparent" r="5" cx="7" cy="7"
                          stroke-dasharray="31.4" stroke-dashoffset="31.4"/>
                </svg>
                <span class="progress-text" id="ring-text-3">0/1</span>
              </div>
              <div class="meta-divider"></div>
              <span class="time-ago">3天前</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 已完成分组 -->
      <div>
        <div class="group-header" onclick="toggleGroup('done')">
          <span>已完成</span>
          <span class="group-count">0</span>
        </div>
        <div class="group-items" id="group-done">
          <!-- 空 -->
        </div>
      </div>
    </div>

    <!-- 右侧：详情面板 -->
    <div class="task-detail-panel" id="detailPanel">
      <div class="detail-empty-state">
        <span class="empty-icon">📝</span>
        <span>选择左侧列表中的待办任务以查看或编辑详情</span>
      </div>
    </div>
  </div>

  <script>
    // 模拟数据源
    const mockTodos = {
      1: {
        id: 1,
        title: '123',
        status: 'todo',
        remindAt: '今天 18:00',
        desc: '这里是关于任务 123 的具体背景信息描述，您可以直接在这里编辑。',
        checklist: [
          { text: '123', done: false },
          { text: '1234', done: false },
          { text: '123456', done: false }
        ],
        time: '25分钟前'
      },
      2: {
        id: 2,
        title: '打茅台水',
        status: 'todo',
        remindAt: '',
        desc: '包含导入导出的完整支持。参考之前做过的便签页面实现。',
        checklist: [
          { text: '培训管理：增加导入导出功能，参考便签页面', done: false }
        ],
        time: '6天前'
      },
      3: {
        id: 3,
        title: '茅台 - 股份可视化报表',
        status: 'doing',
        remindAt: '',
        desc: '完成股份部分的报表可视化展示，对接已有的后台 API 并进行图表绘制。',
        checklist: [
          { text: '股份可视化报表', done: false }
        ],
        time: '3天前'
      }
    };

    let selectedTaskId = null;

    // 选择任务显示详情
    function selectTask(id) {
      selectedTaskId = id;
      
      // 激活高亮
      document.querySelectorAll('.task-row').forEach(row => row.classList.remove('active'));
      const activeRow = document.getElementById('task-' + id);
      if (activeRow) activeRow.classList.add('active');

      const todo = mockTodos[id];
      const panel = document.getElementById('detailPanel');

      const statusLabels = {
        todo: '待办',
        doing: '进行中',
        done: '已完成'
      };

      const statusPillClass = `detail-status-pill status-${todo.status}`;

      let checklistHtml = todo.checklist.map((item, idx) => `
        <div class="detail-checklist-item ${item.done ? 'completed' : ''}" onclick="toggleDetailSubtask(${id}, ${idx})">
          <div class="detail-checklist-check">✓</div>
          <input type="text" class="detail-checklist-text" value="${item.text}" onclick="event.stopPropagation()">
        </div>
      `).join('');

      let flowBtnHtml = '';
      if (todo.status === 'todo') {
        flowBtnHtml = `<button class="btn btn-primary" onclick="changeStatus(${id}, 'doing')">▶ 开始执行</button>`;
      } else if (todo.status === 'doing') {
        flowBtnHtml = `
          <button class="btn" onclick="changeStatus(${id}, 'todo')">↩ 退回到待办</button>
          <button class="btn btn-success" onclick="changeStatus(${id}, 'done')">✓ 完成任务</button>
        `;
      } else {
        flowBtnHtml = `<button class="btn" onclick="changeStatus(${id}, 'doing')">↩ 重启任务</button>`;
      }

      panel.innerHTML = `
        <div class="detail-content">
          <div class="detail-header-row">
            <input type="text" class="detail-title-input" value="${todo.title}" onchange="updateTitle(${id}, this.value)">
            <span class="${statusPillClass}">${statusLabels[todo.status]}</span>
          </div>

          <div>
            <div class="detail-section-title">任务描述 / 备注</div>
            <div class="detail-desc" contenteditable="true" onblur="updateDesc(${id}, this.innerText)">${todo.desc || '添加描述...'}</div>
          </div>

          <div>
            <div class="detail-section-title">任务清单 / 子步骤</div>
            <div class="detail-checklist">
              ${checklistHtml}
            </div>
          </div>

          <div class="detail-actions-footer">
            <button class="btn btn-danger" onclick="deleteTask(${id})">✕ 删除</button>
            <div style="display: flex; gap: 8px;">
              ${flowBtnHtml}
            </div>
          </div>
        </div>
      `;
    }

    // 切换子任务状态，并更新左侧列表行的徽章
    function toggleDetailSubtask(todoId, subtaskIdx) {
      const todo = mockTodos[todoId];
      const item = todo.checklist[subtaskIdx];
      item.done = !item.done;

      // 刷新详情面板和左侧行
      selectTask(todoId);
      updateRowMeta(todoId);
    }

    // 更新左侧列表行的子任务统计徽章
    function updateRowMeta(todoId) {
      const todo = mockTodos[todoId];
      const doneCount = todo.checklist.filter(item => item.done).length;
      const total = todo.checklist.length;
      const ratio = `${doneCount}/${total}`;

      // 更新数字
      const textLabel = document.getElementById('ring-text-' + todoId);
      if (textLabel) textLabel.textContent = ratio;

      // 更新 SVG 环形进度圈
      const circle = document.getElementById('ring-circle-' + todoId);
      if (circle) {
        const perimeter = 2 * Math.PI * 5; // 31.4
        const percent = total > 0 ? doneCount / total : 0;
        const offset = perimeter - (percent * perimeter);
        circle.style.strokeDashoffset = offset;
      }

      const row = document.getElementById('task-' + todoId);
      if (row) {
        if (doneCount === total && todo.status === 'done') {
          row.classList.add('completed');
        } else {
          row.classList.remove('completed');
        }
      }
    }

    // 更新标题
    function updateTitle(id, newTitle) {
      mockTodos[id].title = newTitle;
      const row = document.getElementById('task-' + id);
      if (row) {
        row.querySelector('.task-title-text').textContent = newTitle;
      }
    }

    // 更新描述
    function updateDesc(id, newDesc) {
      mockTodos[id].desc = newDesc;
    }

    // 流转状态
    function changeStatus(id, newStatus) {
      mockTodos[id].status = newStatus;
      
      // 重载详情
      selectTask(id);
      
      // 更新左侧列表行
      const row = document.getElementById('task-' + id);
      if (row) {
        row.className = 'task-row ' + (newStatus === 'done' ? 'completed' : newStatus === 'doing' ? 'doing' : '');
        const check = row.querySelector('.task-checkbox-circle');
        if (newStatus === 'done') {
          check.textContent = '✓';
        } else if (newStatus === 'doing') {
          check.textContent = '▶';
        } else {
          check.textContent = '✓';
        }

        const targetGroup = document.getElementById('group-' + newStatus);
        if (targetGroup) {
          targetGroup.appendChild(row);
        }
      }

      updateGroupCounts();
    }

    // 更新分组数量
    function updateGroupCounts() {
      ['todo', 'doing', 'done'].forEach(status => {
        const groupItems = document.getElementById('group-' + status);
        const countBadge = groupItems.previousElementSibling.querySelector('.group-count');
        if (countBadge && groupItems) {
          countBadge.textContent = groupItems.children.length;
        }
      });
    }

    // 折叠展开分组
    function toggleGroup(status) {
      const items = document.getElementById('group-' + status);
      const header = items.previousElementSibling;
      items.classList.toggle('collapsed');
      header.classList.toggle('collapsed');
    }

    // 删除任务模拟
    function deleteTask(id) {
      const row = document.getElementById('task-' + id);
      if (row) row.remove();
      document.getElementById('detailPanel').innerHTML = `
        <div class="detail-empty-state">
          <span class="empty-icon">📝</span>
          <span>选择左侧列表中的待办任务以查看或编辑详情</span>
        </div>
      `;
      updateGroupCounts();
    }
  </script>
</body>
</html>
