<head>

<link rel="stylesheet" href="css/base.css">

<!-- P8-5：可见壳由 Vue AppLayout 接管；P9-2：项目介绍已迁 Vue ProjectIntroDialog -->
<div id="app" aria-live="polite"></div>

<div class="sys-dialog-overlay" id="sysDialog">
  <div class="sys-dialog">
    <div class="sys-dialog-icon" id="sysDialogIcon">⚠️</div>

    <div class="sys-dialog-btns" id="sysDialogBtns"></div>

<script src="js/xterm-addon-webgl.js"></script>
<script type="module" src="/src/main.ts"></script>
<script>
  window.addEventListener('error', function(e) {
    try {
      if (window.WS && WS.socket && WS.socket.readyState === 1) {
        WS.socket.send(JSON.stringify({
          type: 'frontend-error',
          data: { message: e.message, stack: e.error ? e.error.stack : '' }
        }));
      }
    } catch (err) {}
  });
</script>
</body>
